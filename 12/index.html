<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커스텀 캐릭터 슈팅 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a202c; /* Tailwind bg-gray-900 */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* 화면 스크롤 방지 */
        }
        
        #game-container {
            position: relative;
            width: 800px;
            max-width: 95vw;
            height: 600px;
            max-height: 70vh;
            background-color: #000;
            border: 2px solid #4a5568; /* Tailwind border-gray-600 */
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* 캔버스 요소가 컨테이너를 꽉 채우도록 설정 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            pointer-events: none; /* UI 레이어 아래의 캔버스 클릭 가능하도록 */
            font-size: 1.25rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        #controls {
            margin-top: 1.5rem;
            display: flex;
            gap: 0.5rem;
            width: 800px;
            max-width: 95vw;
            background: #2d3748; /* Tailwind bg-gray-800 */
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex-wrap: wrap; /* 작은 화면에서 줄바꿈 */
        }

        #controls input {
            flex-grow: 1;
            padding: 0.5rem;
            border-radius: 0.25rem;
            border: 1px solid #4a5568;
            background: #1a202c;
            color: white;
        }

        #controls button {
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            background: #4299e1; /* Tailwind bg-blue-500 */
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        #controls button:hover {
            background: #3182ce; /* Tailwind bg-blue-600 */
        }
        
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none; /* 기본적으로 숨김 */
            z-index: 10;
        }
        
        .hidden {
            display: none !important;
        }

        #mobile-controls {
            display: none;
            width: 100%;
            max-width: 800px;
            justify-content: space-between;
            margin-top: 10px;
            padding: 0 10px;
        }

        .mobile-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            user-select: none;
            touch-action: manipulation;
        }

        #fire-btn {
            background: rgba(229, 62, 62, 0.3); /* Red tint for fire */
            border-color: rgba(229, 62, 62, 0.6);
        }

        @media (max-width: 768px) {
            #mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <h1 class="text-3xl font-bold mb-4 mt-2">스페이스 슈팅</h1>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div>점수: <span id="scoreDisplay">0</span></div>
            <div>생명력: <span id="livesDisplay">3</span></div>
        </div>
        
        <div id="game-over-screen">
            <h2 class="text-5xl font-bold text-red-500 mb-4">GAME OVER</h2>
            <p class="text-2xl mb-6">최종 점수: <span id="final-score">0</span></p>
            <button id="restart-btn" class="px-6 py-3 bg-green-500 hover:bg-green-600 rounded text-xl font-bold transition-colors">다시 시작</button>
        </div>
    </div>
    
    <div id="mobile-controls">
        <div style="display: flex; gap: 10px;">
            <div class="mobile-btn" id="btn-left">◀</div>
            <div class="mobile-btn" id="btn-right">▶</div>
        </div>
        <div class="mobile-btn" id="fire-btn">💥</div>
    </div>

    <div id="controls">
        <label for="charUrl" class="self-center whitespace-nowrap">커스텀 캐릭터 (이미지 URL):</label>
        <input type="text" id="charUrl" placeholder="https://example.com/your-image.png">
        <button id="updateCharBtn">캐릭터 적용</button>
    </div>
    
    <div class="mt-4 text-gray-400 text-sm text-center">
        이동: 방향키 또는 WASD | 발사: 스페이스바<br>
        모바일에서는 화면 아래 버튼을 사용하세요.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const charUrlInput = document.getElementById('charUrl');
        const updateCharBtn = document.getElementById('updateCharBtn');

        // 게임 설정 변수
        let GAME_WIDTH = 800;
        let GAME_HEIGHT = 600;
        
        // 캔버스 크기 조정 함수
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            // CSS 크기에 맞춰 실제 캔버스 해상도 설정
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            GAME_WIDTH = canvas.width;
            GAME_HEIGHT = canvas.height;
            
            // 플레이어 위치 재조정 (화면 밖으로 나가지 않게)
            if (player) {
                player.y = GAME_HEIGHT - player.height - 20;
                if (player.x > GAME_WIDTH - player.width) {
                    player.x = GAME_WIDTH - player.width;
                }
            }
        }

        window.addEventListener('resize', resizeCanvas);

        // 키 입력 상태 추적
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            ArrowUp: false,
            ArrowDown: false,
            a: false, d: false, w: false, s: false,
            ' ': false
        };

        // 이벤트 리스너 등록 (키보드)
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
            
            // 스페이스바 스크롤 방지
            if(e.key === ' ' && e.target === document.body) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
            if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
            
            if (e.key === ' ' || e.key.toLowerCase() === ' ') {
                player.canShoot = true; // 스페이스바를 떼면 다시 쏠 수 있게 함 (연사 방지용)
            }
        });

        // 모바일 컨트롤 설정
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const fireBtn = document.getElementById('fire-btn');

        // 모바일 터치 이벤트 헬퍼
        function addTouchEvents(element, actionDown, actionUp) {
            element.addEventListener('touchstart', (e) => {
                e.preventDefault();
                actionDown();
            }, {passive: false});
            
            element.addEventListener('touchend', (e) => {
                e.preventDefault();
                actionUp();
            }, {passive: false});
            
            // 마우스 호환성
            element.addEventListener('mousedown', actionDown);
            element.addEventListener('mouseup', actionUp);
            element.addEventListener('mouseleave', actionUp);
        }

        addTouchEvents(btnLeft, () => keys.ArrowLeft = true, () => keys.ArrowLeft = false);
        addTouchEvents(btnRight, () => keys.ArrowRight = true, () => keys.ArrowRight = false);
        addTouchEvents(fireBtn, 
            () => { keys[' '] = true; }, 
            () => { keys[' '] = false; player.canShoot = true; }
        );


        // 게임 상태 변수
        let gameState = 'playing'; // 'playing', 'gameover'
        let score = 0;
        let lives = 3;
        let frameCount = 0;
        let animationId;

        // 커스텀 이미지 객체
        const customPlayerImage = new Image();
        let useCustomImage = false;

        // 플레이어 객체
        const player = {
            x: GAME_WIDTH / 2 - 25,
            y: GAME_HEIGHT - 70,
            width: 50,
            height: 50,
            speed: 5,
            color: '#3498db',
            canShoot: true,
            cooldown: 0,
            draw: function() {
                if (useCustomImage && customPlayerImage.complete && customPlayerImage.naturalWidth !== 0) {
                    // 커스텀 이미지 그리기
                    ctx.drawImage(customPlayerImage, this.x, this.y, this.width, this.height);
                } else {
                    // 기본 도형 그리기 (우주선 모양)
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(this.x + this.width / 2, this.y); // 상단 뾰족한 부분
                    ctx.lineTo(this.x + this.width, this.y + this.height); // 우측 하단
                    ctx.lineTo(this.x + this.width / 2, this.y + this.height - 10); // 하단 중앙 들어간 부분
                    ctx.lineTo(this.x, this.y + this.height); // 좌측 하단
                    ctx.closePath();
                    ctx.fill();
                    
                    // 불꽃 효과
                    if (keys.ArrowUp || keys.w) {
                        ctx.fillStyle = '#e74c3c';
                        ctx.beginPath();
                        ctx.moveTo(this.x + this.width/2 - 10, this.y + this.height - 5);
                        ctx.lineTo(this.x + this.width/2, this.y + this.height + 15 + Math.random()*10);
                        ctx.lineTo(this.x + this.width/2 + 10, this.y + this.height - 5);
                        ctx.fill();
                    }
                }
            },
            update: function() {
                // 이동 로직
                if ((keys.ArrowLeft || keys.a) && this.x > 0) this.x -= this.speed;
                if ((keys.ArrowRight || keys.d) && this.x < GAME_WIDTH - this.width) this.x += this.speed;
                if ((keys.ArrowUp || keys.w) && this.y > 0) this.y -= this.speed;
                if ((keys.ArrowDown || keys.s) && this.y < GAME_HEIGHT - this.height) this.y += this.speed;

                // 쿨다운 감소
                if (this.cooldown > 0) this.cooldown--;

                // 발사 로직
                if (keys[' '] && this.canShoot && this.cooldown === 0) {
                    bullets.push(new Bullet(this.x + this.width / 2 - 2, this.y));
                    this.canShoot = false; // 키를 뗄 때까지 재발사 금지 (선택적)
                    this.cooldown = 15; // 연사 속도 제한 (프레임)
                }
            }
        };

        // 배열 관리
        const bullets = [];
        const enemies = [];
        const particles = []; // 폭발 파티클용

        // 총알 클래스
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 4;
                this.height = 15;
                this.speed = 10;
                this.color = '#f1c40f'; // 노란색 총알
                this.markedForDeletion = false;
            }
            update() {
                this.y -= this.speed;
                if (this.y + this.height < 0) this.markedForDeletion = true;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // 총알 빛 효과
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0; // 리셋
            }
        }

        // 적 클래스
        class Enemy {
            constructor() {
                this.width = 40;
                this.height = 40;
                this.x = Math.random() * (GAME_WIDTH - this.width);
                this.y = -this.height; // 화면 밖에서 시작
                this.speed = Math.random() * 2 + 1; // 1~3 사이 속도
                this.hp = 1;
                this.markedForDeletion = false;
                
                // 적 모양 다양화를 위한 랜덤 색상
                const colors = ['#e74c3c', '#9b59b6', '#2ecc71', '#e67e22'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y += this.speed;
                if (this.y > GAME_HEIGHT) {
                    this.markedForDeletion = true;
                    loseLife();
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                // 약간 둥근 사각형 그리기
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 5);
                ctx.fill();
                
                // 외계인 눈 모양
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.x + 10, this.y + 15, 5, 0, Math.PI*2);
                ctx.arc(this.x + 30, this.y + 15, 5, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // 폭발 파티클 클래스
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 3 + 1;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                this.life = 1.0; // 투명도로 사용
                this.decay = Math.random() * 0.05 + 0.02;
                this.markedForDeletion = false;
            }
            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.life -= this.decay;
                if (this.life <= 0) this.markedForDeletion = true;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 파티클 생성 함수
        function createExplosion(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // 충돌 감지 함수 (AABB)
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        // 생명 감소 함수
        function loseLife() {
            if (gameState !== 'playing') return;
            
            lives--;
            livesDisplay.innerText = lives;
            
            // 시각적 피드백 (화면 빨갛게 깜빡임)
            const container = document.getElementById('game-container');
            container.style.boxShadow = "inset 0 0 50px rgba(255,0,0,0.8)";
            setTimeout(() => {
                container.style.boxShadow = "0 10px 25px rgba(0,0,0,0.5)";
            }, 200);

            if (lives <= 0) {
                gameOver();
            }
        }

        // 게임 오버 처리
        function gameOver() {
            gameState = 'gameover';
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.style.display = 'flex';
            finalScoreDisplay.innerText = score;
        }

        // 게임 초기화
        function resetGame() {
            // 변수 초기화
            score = 0;
            lives = 3;
            frameCount = 0;
            gameState = 'playing';
            
            // 배열 비우기 (직접 참조 유지하면서 내용만 비움)
            bullets.length = 0;
            enemies.length = 0;
            particles.length = 0;
            
            // 플레이어 위치 초기화
            player.x = GAME_WIDTH / 2 - player.width / 2;
            player.y = GAME_HEIGHT - player.height - 20;
            
            // UI 업데이트
            scoreDisplay.innerText = score;
            livesDisplay.innerText = lives;
            gameOverScreen.classList.add('hidden');
            gameOverScreen.style.display = 'none';
            
            // 이전 애니메이션 프레임 취소 후 재시작
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        // 메인 게임 루프
        function gameLoop() {
            if (gameState !== 'playing') return;

            // 1. 화면 지우기
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 배경 별 효과 (간단히)
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            if (frameCount % 5 === 0) {
                ctx.fillRect(Math.random() * GAME_WIDTH, 0, 2, 2);
            }
            
            // 2. 객체 업데이트
            player.update();

            // 적 생성 로직 (시간이 지날수록 또는 점수가 높을수록 자주 생성)
            let spawnRate = Math.max(20, 60 - Math.floor(score / 50)); 
            if (frameCount % spawnRate === 0) {
                enemies.push(new Enemy());
            }

            // 총알 업데이트 및 화면 그리기
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                bullets[i].draw();
                if (bullets[i].markedForDeletion) {
                    bullets.splice(i, 1);
                }
            }

            // 적 업데이트, 화면 그리기, 충돌 검사
            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                enemy.update();
                enemy.draw();

                // 적과 플레이어 충돌 검사
                if (checkCollision(player, enemy)) {
                    enemy.markedForDeletion = true;
                    createExplosion(player.x + player.width/2, player.y + player.height/2, '#3498db', 30);
                    createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                    loseLife();
                }

                // 총알과 적 충돌 검사
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let bullet = bullets[j];
                    if (checkCollision(bullet, enemy)) {
                        // 충돌 발생
                        enemy.hp--;
                        bullet.markedForDeletion = true;
                        
                        // 작은 파티클 효과
                        createExplosion(bullet.x, bullet.y, '#f1c40f', 5);

                        if (enemy.hp <= 0) {
                            enemy.markedForDeletion = true;
                            score += 10;
                            scoreDisplay.innerText = score;
                            // 큰 폭발 효과
                            createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                        }
                        break; // 한 총알이 하나의 적만 맞추도록
                    }
                }

                if (enemy.markedForDeletion) {
                    enemies.splice(i, 1);
                }
            }

            // 파티클 업데이트 및 그리기
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].markedForDeletion) {
                    particles.splice(i, 1);
                }
            }

            // 3. 플레이어 그리기 (가장 위에 그려지도록)
            player.draw();

            frameCount++;
            animationId = requestAnimationFrame(gameLoop);
        }

        // 커스텀 캐릭터 설정 이벤트
        updateCharBtn.addEventListener('click', () => {
            const url = charUrlInput.value.trim();
            if (url) {
                // 이미지 로드 시도
                customPlayerImage.onload = () => {
                    useCustomImage = true;
                    // 이미지 비율 유지하면서 크기 조정 (선택적)
                    // const ratio = customPlayerImage.naturalWidth / customPlayerImage.naturalHeight;
                    // player.height = 50;
                    // player.width = 50 * ratio;
                    
                    // 알림 대신 콘솔이나 간단한 UI 피드백 권장
                    updateCharBtn.innerText = '적용됨!';
                    updateCharBtn.style.backgroundColor = '#48bb78'; // 초록색
                    setTimeout(() => {
                        updateCharBtn.innerText = '캐릭터 적용';
                        updateCharBtn.style.backgroundColor = '#4299e1'; // 원래 파란색
                    }, 2000);
                };
                
                customPlayerImage.onerror = () => {
                    useCustomImage = false;
                    // 에러 피드백
                    updateCharBtn.innerText = '로드 실패';
                    updateCharBtn.style.backgroundColor = '#e53e3e'; // 빨간색
                    setTimeout(() => {
                        updateCharBtn.innerText = '캐릭터 적용';
                        updateCharBtn.style.backgroundColor = '#4299e1';
                    }, 2000);
                };
                
                // 보안 문제 방지를 위해 crossOrigin 설정이 필요할 수 있음
                // 외부 이미지를 Canvas에 그릴 때 발생할 수 있는 Tainted canvas 문제 완화
                customPlayerImage.crossOrigin = "Anonymous";
                customPlayerImage.src = url;
            } else {
                // URL이 비어있으면 기본 도형으로 복구
                useCustomImage = false;
            }
        });

        // 다시 시작 버튼 이벤트
        restartBtn.addEventListener('click', resetGame);

        // 초기화 코드
        window.onload = () => {
            resizeCanvas();
            resetGame();
        };

    </script>
</body>
</html>
