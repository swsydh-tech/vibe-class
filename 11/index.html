    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->

    <!-- Feather Icons -->

    <style>
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1); box-shadow: 0 0 10px 2px rgba(255,255,255,0.4); }
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .icon svg { width: 100%; height: 100%; }
        body { margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; background-color: #020617; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // [수정] feather.replace() 대신 React가 직접 SVG를 그리는 아이콘 컴포넌트
        // (feather.replace()가 React 몰래 DOM을 바꾸면 다음 라운드에서 오류가 나 화면이 꺼졌음)
        const Icon = ({ name, className = "" }) => {
            const svg = (window.feather && feather.icons[name]) ? feather.icons[name].toSvg() : "";
            return <span className={`icon inline-block ${className}`} dangerouslySetInnerHTML={{ __html: svg }} />;
        };

        // 아이콘 컴포넌트들 (Feather 기반)
        const IconSparkles = () => <Icon name="star" className="!block w-16 h-16 text-yellow-300 mx-auto mb-6 animate-pulse-slow" />;
        const IconStar = ({className}) => <Icon name="star" className={className} />;
        const IconTrophyLg = () => <Icon name="award" className="!block w-24 h-24 text-yellow-400 mx-auto mb-6 drop-shadow-[0_0_15px_rgba(250,204,21,0.6)]" />;
        const IconTrophySm = () => <Icon name="award" className="w-6 h-6 text-yellow-400" />;
        const IconRefresh = () => <Icon name="rotate-cw" className="w-5 h-5" />;
        const IconCheck = () => <Icon name="check-circle" className="w-6 h-6 text-emerald-400 relative z-10 animate-bounce" />;
        const IconX = () => <Icon name="x-circle" className="w-6 h-6 text-rose-400 relative z-10" />;
        const IconLoader = () => <Icon name="loader" className="w-10 h-10 text-indigo-400 animate-spin" />;

        // 88 Constellations Data
        const CONSTELLATIONS = [

            { abbr: "Aql", en: "Aquila", ko: "독수리자리" }, { abbr: "Ara", en: "Ara", ko: "제단자리" },

            { abbr: "Cet", en: "Cetus", ko: "고래자리" }, { abbr: "Cha", en: "Chamaeleon", ko: "카멜레온자리" },
            { abbr: "Cir", en: "Circinus", ko: "컴퍼스자리" }, { abbr: "Col", en: "Columba", ko: "비둘기자리" },
            { abbr: "Com", en: "Coma Berenices", ko: "머리털자리" }, { abbr: "CrA", en: "Corona Australis", ko: "남쪽왕관자리" },
            { abbr: "CrB", en: "Corona Borealis", ko: "북쪽왕관자리" }, { abbr: "Crv", en: "Corvus", ko: "까마귀자리" },
            { abbr: "Crt", en: "Crater", ko: "컵자리" }, { abbr: "Cru", en: "Crux", ko: "남십자자리" },
            { abbr: "Cyg", en: "Cygnus", ko: "백조자리" }, { abbr: "Del", en: "Delphinus", ko: "돌고래자리" },
            { abbr: "Dor", en: "Dorado", ko: "황새치자리" }, { abbr: "Dra", en: "Draco", ko: "용자리" },
            { abbr: "Equ", en: "Equuleus", ko: "조랑말자리" }, { abbr: "Eri", en: "Eridanus", ko: "에리다누스자리" },
            { abbr: "For", en: "Fornax", ko: "화로자리" }, { abbr: "Gem", en: "Gemini", ko: "쌍둥이자리" },
            { abbr: "Gru", en: "Grus", ko: "두루미자리" }, { abbr: "Her", en: "Hercules", ko: "허큘리스자리" },
            { abbr: "Hor", en: "Horologium", ko: "시계자리" }, { abbr: "Hya", en: "Hydra", ko: "바다뱀자리" },
            { abbr: "Hyi", en: "Hydrus", ko: "물뱀자리" }, { abbr: "Ind", en: "Indus", ko: "인디언자리" },
            { abbr: "Lac", en: "Lacerta", ko: "도마뱀자리" }, { abbr: "Leo", en: "Leo", ko: "사자자리" },
            { abbr: "LMi", en: "Leo Minor", ko: "작은사자자리" }, { abbr: "Lep", en: "Lepus", ko: "토끼자리" },
            { abbr: "Lib", en: "Libra", ko: "천칭자리" }, { abbr: "Lup", en: "Lupus", ko: "이리자리" },
            { abbr: "Lyn", en: "Lynx", ko: "살쾡이자리" }, { abbr: "Lyr", en: "Lyra", ko: "거문고자리" },
            { abbr: "Men", en: "Mensa", ko: "테이블산자리" }, { abbr: "Mic", en: "Microscopium", ko: "현미경자리" },
            { abbr: "Mon", en: "Monoceros", ko: "외뿔소자리" }, { abbr: "Mus", en: "Musca", ko: "파리자리" },
            { abbr: "Nor", en: "Norma", ko: "직각자자리" }, { abbr: "Oct", en: "Octans", ko: "팔분의자리" },
            { abbr: "Oph", en: "Ophiuchus", ko: "뱀주인자리" }, { abbr: "Ori", en: "Orion", ko: "오리온자리" },
            { abbr: "Pav", en: "Pavo", ko: "공작자리" }, { abbr: "Peg", en: "Pegasus", ko: "페가수스자리" },
            { abbr: "Per", en: "Perseus", ko: "페르세우스자리" }, { abbr: "Phe", en: "Phoenix", ko: "봉황자리" },
            { abbr: "Pic", en: "Pictor", ko: "화가자리" }, { abbr: "Psc", en: "Pisces", ko: "물고기자리" },
            { abbr: "PsA", en: "Piscis Austrinus", ko: "남쪽물고기자리" }, { abbr: "Pup", en: "Puppis", ko: "고물자리" },
            { abbr: "Pyx", en: "Pyxis", ko: "나침반자리" }, { abbr: "Ret", en: "Reticulum", ko: "그물자리" },
            { abbr: "Sge", en: "Sagitta", ko: "화살자리" }, { abbr: "Sgr", en: "Sagittarius", ko: "궁수자리" },
            { abbr: "Sco", en: "Scorpius", ko: "전갈자리" }, { abbr: "Scl", en: "Sculptor", ko: "조각가자리" },
            { abbr: "Sct", en: "Scutum", ko: "방패자리" }, { abbr: "Ser", en: "Serpens", ko: "뱀자리" },
            { abbr: "Sex", en: "Sextans", ko: "육분의자리" }, { abbr: "Tau", en: "Taurus", ko: "황소자리" },
            { abbr: "Tel", en: "Telescopium", ko: "망원경자리" }, { abbr: "Tri", en: "Triangulum", ko: "삼각형자리" },
            { abbr: "TrA", en: "Triangulum Australe", ko: "남쪽삼각형자리" }, { abbr: "Tuc", en: "Tucana", ko: "큰부리새자리" },
            { abbr: "UMa", en: "Ursa Major", ko: "큰곰자리" }, { abbr: "UMi", en: "Ursa Minor", ko: "작은곰자리" },
            { abbr: "Vel", en: "Vela", ko: "돛자리" }, { abbr: "Vir", en: "Virgo", ko: "처녀자리" },
            { abbr: "Vol", en: "Volans", ko: "날치자리" }, { abbr: "Vul", en: "Vulpecula", ko: "작은여우자리" }
        ];

        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const generateOptions = (correctConstellation, allConstellations, numOptions = 4) => {
            const options = [correctConstellation];
            const others = allConstellations.filter(c => c.ko !== correctConstellation.ko);
            const shuffledOthers = shuffleArray(others);
            
            for (let i = 0; i < numOptions - 1; i++) {
                options.push(shuffledOthers[i]);
            }
            return shuffleArray(options);
        };

        const findFeature = (geoData, abbr) => {
            if (!geoData || !geoData.features || !abbr) return null;
            const lowerAbbr = abbr.toLowerCase();
            return geoData.features.find(f => 
                (f.id && f.id.toLowerCase() === lowerAbbr) ||
                (f.properties?.id && f.properties.id.toLowerCase() === lowerAbbr) ||
                (f.properties?.brk && f.properties.brk.toLowerCase() === lowerAbbr) ||
                (f.properties?.name && f.properties.name.toLowerCase() === lowerAbbr)
            );
        };

        const ConstellationShape = ({ feature }) => {
            if (!feature || !feature.geometry) return null;

            let lines = [];
            if (feature.geometry.type === 'MultiLineString') {
                lines = feature.geometry.coordinates;
            } else if (feature.geometry.type === 'LineString') {
                lines = [feature.geometry.coordinates];
            } else {
                return <div className="text-white text-center">지원하지 않는 도형입니다.</div>;
            }

            let ras = [];
            let decs = [];
            
            lines.forEach(line => {
                line.forEach(pt => { ras.push(pt[0]); decs.push(pt[1]); });
            });

            const crossesMeridian = ras.some(r => r > 90) && ras.some(r => r < -90);
            const normalizedLines = lines.map(line => 
                line.map(pt => {
                    let ra = pt[0];
                    if (crossesMeridian && ra < 0) ra += 360;
                    return [ra, pt[1]];
                })
            );

            let nRas = [];
            let nDecs = [];
            normalizedLines.forEach(line => {
                line.forEach(pt => { nRas.push(pt[0]); nDecs.push(pt[1]); });
            });

            const minRa = Math.min(...nRas);
            const maxRa = Math.max(...nRas);
            const minDec = Math.min(...nDecs);
            const maxDec = Math.max(...nDecs);
            
            const width = 300;
            const height = 300;
            const padding = 30;
            
            const raRange = Math.max(maxRa - minRa, 0.1);
            const decRange = Math.max(maxDec - minDec, 0.1);
            const meanDec = (minDec + maxDec) / 2;
            const raRangeTrue = raRange * Math.cos(meanDec * Math.PI / 180);
            
            const scale = Math.min(
                (width - padding * 2) / raRangeTrue,
                (height - padding * 2) / decRange
            );

            const project = (ra, dec) => {
                const cx = width / 2;
                const cy = height / 2;
                const dx = (ra - (minRa + maxRa)/2) * Math.cos(meanDec * Math.PI / 180);
                const dy = (dec - (minDec + maxDec)/2);
                
                const x = cx - (dx * scale);
                const y = cy - (dy * scale);
                return {x, y};
            };

            const starsMap = new Map();

            const svgLines = normalizedLines.map((line, i) => {
                const pts = line.map(pt => {
                    const {x, y} = project(pt[0], pt[1]);
                    starsMap.set(`${pt[0].toFixed(2)},${pt[1].toFixed(2)}`, {x, y});
                    return `${x},${y}`;
                }).join(" ");
                
                return (
                    <polyline 
                        key={`line-${i}`} 
                        points={pts} 
                        fill="none" 
                        stroke="rgba(165, 180, 252, 0.7)" 
                        strokeWidth="3" 
                        strokeLinecap="round" 
                        strokeLinejoin="round" 
                        style={{ filter: 'drop-shadow(0 0 4px rgba(129, 140, 248, 0.8))' }} 
                    />
                );
            });

            const svgStars = Array.from(starsMap.values()).map((pos, i) => (
                <circle 
                    key={`star-${i}`} 
                    cx={pos.x} 
                    cy={pos.y} 
                    r="4" 
                    fill="#ffffff" 
                    style={{ filter: 'drop-shadow(0 0 6px #ffffff)' }} 
                />
            ));

            return (
                <svg className="w-full h-full drop-shadow-2xl animate-pulse-slow" viewBox={`0 0 ${width} ${height}`}>
                    {svgLines}
                    {svgStars}
                </svg>
            );
        };

        function App() {
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [options, setOptions] = useState([]);
            const [score, setScore] = useState(0);
            const [round, setRound] = useState(1);
            const [gameState, setGameState] = useState('start');
            const [selectedOption, setSelectedOption] = useState(null);
            
            const [geoData, setGeoData] = useState(null);
            const [isLoadingGeo, setIsLoadingGeo] = useState(true);
            const [geoError, setGeoError] = useState(false);
            const [stars, setStars] = useState([]);

            const MAX_ROUNDS = 10;

            useEffect(() => {
                const newStars = Array.from({ length: 70 }).map(() => ({
                    id: Math.random(),
                    left: `${Math.random() * 100}%`,
                    top: `${Math.random() * 100}%`,
                    animationDuration: `${Math.random() * 3 + 2}s`,
                    animationDelay: `${Math.random() * 2}s`,
                    size: `${Math.random() * 2 + 1}px`,
                }));
                setStars(newStars);
                
                const fetchGeo = async () => {
                    try {
                        const res = await fetch("https://cdn.jsdelivr.net/npm/d3-celestial@0.7.35/data/constellations.lines.json");
                        if (!res.ok) throw new Error("Failed to fetch");
                        const data = await res.json();
                        setGeoData(data);
                    } catch(e) {
                        console.error(e);
                        setGeoError(true);
                    } finally {
                        setIsLoadingGeo(false);
                    }
                };
                fetchGeo();
            }, []);

            const startNewGame = () => {
                setScore(0);
                setRound(1);
                loadNextQuestion();
            };

            const loadNextQuestion = () => {
                let validConstellations = CONSTELLATIONS;
                if (geoData && !geoError) {
                    validConstellations = CONSTELLATIONS.filter(c => findFeature(geoData, c.abbr));
                }
                
                if (validConstellations.length === 0) validConstellations = CONSTELLATIONS;

                const randomConstellation = validConstellations[Math.floor(Math.random() * validConstellations.length)];
                const newOptions = generateOptions(randomConstellation, CONSTELLATIONS);
                
                setCurrentQuestion(randomConstellation);
                setOptions(newOptions);
                setSelectedOption(null);
                setGameState('playing');
            };

            const handleOptionClick = (option) => {
                if (gameState !== 'playing') return;

                setSelectedOption(option);
                const isCorrect = option.ko === currentQuestion.ko;
                
                if (isCorrect) setScore(prev => prev + 10);
                setGameState('result');

                setTimeout(() => {
                    if (round >= MAX_ROUNDS) {
                        setGameState('end');
                    } else {
                        setRound(prev => prev + 1);
                        loadNextQuestion();
                    }
                }, 1800);
            };

            const renderStartScreen = () => (
                <div className="flex flex-col items-center justify-center h-full text-center space-y-8 z-10 relative px-4">
                    <div className="bg-slate-900/60 p-8 rounded-3xl border border-indigo-500/30 backdrop-blur-md shadow-2xl">
                        <IconSparkles />
                        <h1 className="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-indigo-300 to-purple-300">
                            별자리 이름 맞추기
                        </h1>
                        <p className="mt-4 text-indigo-200 text-lg max-w-md mx-auto leading-relaxed">
                            밤하늘을 수놓는 별자리의 <b>모양만 보고</b> 이름을 맞춰보세요. 우주 지식을 테스트할 시간입니다!
                        </p>
                    </div>
                    
                    {isLoadingGeo ? (
                        <div className="flex flex-col items-center gap-4 mt-8">
                            <IconLoader />
                            <span className="text-indigo-300 font-medium">별자리 지도 불러오는 중...</span>
                        </div>
                    ) : (
                        <button 
                            onClick={startNewGame}
                            className="group relative px-8 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-full text-xl overflow-hidden shadow-[0_0_40px_rgba(79,70,229,0.5)] transition-transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2"
                        >
                            게임 시작하기 <Icon name="arrow-right" className="w-5 h-5 group-hover:translate-x-1 transition-transform" />
                        </button>
                    )}
                </div>
            );

            const renderEndScreen = () => (
                <div className="flex flex-col items-center justify-center h-full text-center space-y-8 z-10 relative px-4">
                    <div className="bg-slate-900/80 p-10 rounded-[3rem] border border-indigo-500/40 backdrop-blur-lg shadow-2xl w-full max-w-md">
                        <IconTrophyLg />
                        <h2 className="text-3xl font-bold text-white mb-2">탐험 완료!</h2>
                        <p className="text-indigo-200 mb-6">모든 별자리 관측을 마쳤습니다.</p>
                        
                        <div className="bg-indigo-950/80 rounded-2xl p-6 mb-8 border border-indigo-500/20">
                            <div className="text-sm text-indigo-300 mb-1 font-medium">최종 점수</div>
                            <div className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500">
                                {score}
                            </div>
                            <div className="text-indigo-300 mt-2 font-medium">
                                총 {MAX_ROUNDS}문제 중 {score / 10}문제 정답
                            </div>
                        </div>

                        <button 
                            onClick={startNewGame}
                            className="flex items-center justify-center gap-2 w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-colors active:scale-95"
                        >
                            <IconRefresh /> 다시 플레이하기
                        </button>
                    </div>
                </div>
            );

            const renderPlayingScreen = () => {
                return (
                    <div className="flex flex-col h-full w-full max-w-3xl mx-auto z-10 relative p-4 lg:p-8">
                        <div className="flex justify-between items-center mb-8 bg-slate-900/60 p-5 rounded-2xl border border-indigo-500/20 backdrop-blur-md shadow-lg">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-500/20 p-2 rounded-lg">
                                    <IconTrophySm />
                                </div>
                                <span className="text-xl font-bold text-white tracking-wide">점수: {score}</span>
                            </div>
                            <div className="text-indigo-200 font-medium bg-indigo-500/20 px-4 py-2 rounded-lg">
                                라운드 <span className="text-white text-xl font-bold">{round}</span> / {MAX_ROUNDS}
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col justify-center items-center mb-8 w-full">
                            <p className="text-indigo-300 mb-6 font-semibold tracking-widest text-sm md:text-base uppercase flex items-center gap-2">
                                <IconStar className="w-4 h-4" /> 이 별자리의 이름은 무엇일까요? <IconStar className="w-4 h-4" />
                            </p>
                            
                            <div className="bg-slate-900/50 p-8 rounded-[2.5rem] border border-indigo-500/30 w-full max-w-sm sm:max-w-md aspect-square shadow-[0_0_50px_rgba(79,70,229,0.15)] backdrop-blur-sm relative flex flex-col items-center justify-center">
                                {findFeature(geoData, currentQuestion?.abbr) ? (
                                    <ConstellationShape feature={findFeature(geoData, currentQuestion?.abbr)} />
                                ) : (
                                    <div className="text-center text-indigo-300 p-4">
                                        <IconLoader />
                                        <p className="mt-4">모양 정보를 불러올 수 없습니다.<br/>(데이터 누락 방지됨)</p>
                                    </div>
                                )}
                                
                                <div className={`absolute bottom-6 left-0 right-0 text-center transition-all duration-500 ${gameState === 'result' ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
                                    <h3 className="text-2xl font-bold text-white mb-2 drop-shadow-md">{currentQuestion?.en}</h3>
                                    <span className="inline-block bg-indigo-600/80 px-4 py-1.5 rounded-full text-white font-mono text-xs font-bold tracking-wider shadow-lg backdrop-blur-md">
                                        약자: {currentQuestion?.abbr}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-auto">
                            {options.map((option, index) => {
                                const isSelected = selectedOption === option;
                                const isCorrectAnswer = option.ko === currentQuestion.ko;
                                
                                let btnClass = "group relative overflow-hidden p-5 rounded-2xl border-2 transition-all duration-300 font-bold text-lg md:text-xl shadow-lg flex items-center justify-between ";
                                
                                if (gameState === 'result') {
                                    if (isCorrectAnswer) {
                                        btnClass += "bg-emerald-500/20 border-emerald-400 text-emerald-300 shadow-[0_0_20px_rgba(52,211,153,0.3)]";
                                    } else if (isSelected) {
                                        btnClass += "bg-rose-500/20 border-rose-400 text-rose-300";
                                    } else {
                                        btnClass += "bg-slate-800/40 border-slate-700/50 text-slate-400 opacity-50";
                                    }
                                } else {
                                    btnClass += "bg-slate-800/80 border-indigo-500/30 text-indigo-100 hover:bg-indigo-700 hover:border-indigo-400 hover:-translate-y-1 hover:shadow-[0_8px_25px_rgba(79,70,229,0.3)]";
                                }

                                return (
                                    <button 
                                        key={index}
                                        onClick={() => handleOptionClick(option)}
                                        disabled={gameState !== 'playing'}
                                        className={btnClass}
                                    >
                                        <span className="relative z-10">{option.ko}</span>
                                        {gameState === 'result' && isCorrectAnswer && <IconCheck />}
                                        {gameState === 'result' && isSelected && !isCorrectAnswer && <IconX />}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-50 font-sans overflow-hidden relative selection:bg-indigo-500/30">
                    <div className="absolute inset-0 overflow-hidden pointer-events-none">
                        <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/40 via-slate-950 to-slate-950"></div>
                        {stars.map(star => (
                            <div
                                key={star.id}
                                className="absolute bg-white rounded-full opacity-0"
                                style={{
                                    left: star.left,
                                    top: star.top,
                                    width: star.size,
                                    height: star.size,
                                    animation: `twinkle ${star.animationDuration} infinite ease-in-out ${star.animationDelay}`
                                }}
                            />
                        ))}
                    </div>

                    <main className="relative w-full h-screen flex flex-col pt-6 pb-10">
                        {gameState === 'start' && renderStartScreen()}
                        {(gameState === 'playing' || gameState === 'result') && renderPlayingScreen()}
                        {gameState === 'end' && renderEndScreen()}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
