<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* 구성: 가운데 한 줄 기둥. '시간 정하기 → 시계 → 끝' 화면이 같은 자리에서 바뀌고, 넓은 화면(교실 TV)에서는 시계와 숫자가 나란히 놓여요. */
:root{
  --paper:#ffffff;        /* 배경 없음(흰 화면) */
  --ink:#111111;          /* 글씨: 검은색 */
  --violet:#7b3fe4;       /* 시계: 보라색 */
  --violet-deep:#4a1fa3;  /* 시계 바늘 */
  --violet-soft:#f2ecfd;  /* 버튼 바탕 */
  --violet-press:#e4d8fb;
  --violet-line:#d6c8f4;  /* 연한 테두리 */
  --alarm:#e3262c;        /* 끝: 빨간색 */
  --alarm-soft:#fde8e8;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word}

.app{max-width:1000px;margin:0 auto;padding-inline:20px;padding-block:18px 40px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.2}
.logo{width:34px;height:34px;flex:none}
.logo-ring{fill:none;stroke:var(--violet);stroke-width:3.5}
.logo-wedge{fill:var(--violet)}

.view{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.view h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.25;text-wrap:balance}
.hint{margin:0;font-size:15px;max-width:34ch;text-wrap:balance}
.msg{margin:0;padding:8px 16px;border-radius:12px;background:var(--alarm-soft);font-size:15px}

/* 시간 정하기 (처음 설정과 연장에 똑같이 쓰여요) */
.setter{display:grid;grid-template-columns:auto auto auto;column-gap:10px;row-gap:8px;justify-content:center;justify-items:center;align-items:center}
.c1{grid-column:1}.c2{grid-column:2}.c3{grid-column:3}
.r1{grid-row:1}.r2{grid-row:2}.r3{grid-row:3}.r4{grid-row:4}
.arrow{width:100%;height:46px;display:grid;place-items:center;padding:0;border:2px solid var(--violet-line);border-radius:14px;background:var(--violet-soft);color:var(--violet);cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.arrow svg{width:22px;height:22px;fill:currentColor}
.arrow:hover{border-color:var(--violet)}
.arrow:active{background:var(--violet-press)}
.num{width:1.7em;margin:0;padding:.06em 0;font-family:var(--font-display);font-size:clamp(56px,17vw,92px);line-height:1.1;text-align:center;color:var(--ink);background:var(--paper);border:2px solid var(--violet-line);border-radius:20px;font-variant-numeric:tabular-nums;caret-color:var(--violet)}
.num:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px var(--violet-soft)}
.colon{font-family:var(--font-display);font-size:clamp(48px,14vw,80px);line-height:1}
.unit-label{font-family:var(--font-display);font-size:18px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 18px;font-family:var(--font-display);font-size:20px;line-height:1;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--violet-soft)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--violet-soft);border-color:var(--violet)}
.btn-primary:hover{background:var(--violet-press)}
.btn-alarm{background:var(--alarm-soft);border-color:var(--alarm)}
.btn-alarm:hover{background:var(--alarm-soft)}
.btn-big{min-height:64px;width:min(100%,320px);font-size:28px}
.btn:focus-visible,.arrow:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

/* 시계 */
.clock-wrap{width:clamp(220px,74vw,340px);aspect-ratio:1;max-width:100%}
.clock{display:block;width:100%;height:100%;overflow:visible}
.face{fill:var(--paper);stroke:var(--violet);stroke-width:5;transition:fill .25s,stroke .25s}
.ticks line{stroke:var(--violet);stroke-linecap:round;transition:stroke .25s}
.slice{fill:var(--violet);transition:opacity .2s}
.hand{stroke:var(--violet-deep);stroke-width:4.5;stroke-linecap:round;transition:stroke .25s,opacity .2s}
.knob{fill:var(--violet-deep);transition:fill .25s}
.knob-dot{fill:var(--paper);transition:fill .25s}
.clock.is-paused .slice{opacity:.45}
.clock.is-paused .hand{opacity:.6}
.clock.is-ended .face{fill:var(--alarm);stroke:var(--alarm)}
.clock.is-ended .ticks line{stroke:var(--paper)}
.clock.is-ended .hand{stroke:var(--paper)}
.clock.is-ended .knob{fill:var(--paper)}
.clock.is-ended .knob-dot{fill:var(--alarm)}
.is-ringing{animation:ring 1s ease-in-out infinite;transform-origin:50% 50%}
@keyframes ring{
  0%,55%,100%{transform:rotate(0)}
  8%{transform:rotate(-7deg)}16%{transform:rotate(7deg)}
  24%{transform:rotate(-5deg)}32%{transform:rotate(5deg)}
  40%{transform:rotate(-2deg)}48%{transform:rotate(2deg)}
}

.info{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0;width:100%}
.status{margin:0;font-family:var(--font-display);font-size:20px}
.digits{margin:0;font-family:var(--font-display);font-size:clamp(64px,19vw,112px);line-height:1;white-space:nowrap}
.digits .d{display:inline-block;width:.6em;text-align:center}
.digits .c{display:inline-block;width:.34em;text-align:center}
.done-title{margin:0;font-family:var(--font-display);font-size:clamp(36px,10vw,54px);line-height:1.2;text-wrap:balance}

/* 연장 */
.extend{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(100%,400px);padding:20px 16px;border:2px solid var(--violet-line);border-radius:24px;background:var(--paper)}
.extend h2{font-size:24px}
.extend .num{font-size:clamp(44px,12vw,68px)}
.extend .colon{font-size:clamp(38px,10vw,58px)}
.extend .arrow{height:40px}

@media (min-width:860px){
  .view-clock{flex-direction:row;justify-content:center;gap:56px}
  .clock-wrap{width:clamp(260px,min(40vw,64vh),440px)}
  .info{width:auto;min-width:340px}
}
@media (prefers-reduced-motion:reduce){
  .is-ringing{animation:none}
  .face,.ticks line,.slice,.hand,.knob,.knob-dot{transition:none}
  .btn:active{transform:none}
}
</style>
</head>
<body>
<main class="app" id="app" data-state="setup">
  <header class="top">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle class="logo-ring" cx="20" cy="20" r="17"/><path class="logo-wedge" d="M20 20 L32.12 27 A14 14 0 1 1 20 6 Z"/></svg>
    <h1>타이머</h1>
  </header>

  <section class="view view-setup" id="view-setup" aria-labelledby="setup-title">
    <h2 id="setup-title">시간을 정해요</h2>
    <div class="setter" id="setter-main">
      <button type="button" class="arrow c1 r1" data-field="min" data-dir="1" aria-label="분 늘리기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 21 18H3Z"/></svg></button>
      <input class="num c1 r2" id="main-min" data-field="min" type="text" inputmode="numeric" autocomplete="off" maxlength="2" value="05" aria-label="분">
      <button type="button" class="arrow c1 r3" data-field="min" data-dir="-1" aria-label="분 줄이기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19 3 6h18Z"/></svg></button>
      <span class="unit-label c1 r4">분</span>
      <span class="colon c2 r2" aria-hidden="true">:</span>
      <button type="button" class="arrow c3 r1" data-field="sec" data-dir="1" aria-label="초 늘리기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 21 18H3Z"/></svg></button>
      <input class="num c3 r2" id="main-sec" data-field="sec" type="text" inputmode="numeric" autocomplete="off" maxlength="2" value="00" aria-label="초">
      <button type="button" class="arrow c3 r3" data-field="sec" data-dir="-1" aria-label="초 줄이기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19 3 6h18Z"/></svg></button>
      <span class="unit-label c3 r4">초</span>
    </div>
    <p class="hint">숫자를 직접 쓰거나 ▲ ▼ 화살표를 눌러 바꿀 수 있어요.</p>
    <p class="msg" id="setup-msg" role="alert" hidden></p>
    <button type="button" class="btn btn-primary btn-big" id="btn-start">시작</button>
  </section>

  <section class="view view-clock" id="view-clock" aria-label="타이머 시계" hidden>
    <div class="clock-wrap" id="clock-wrap">
      <svg class="clock" id="clock" viewBox="0 0 200 200" role="img" aria-label="남은 시간만큼 보라색이 남아 있는 시계">
        <circle class="face" cx="100" cy="100" r="93"/>
        <path class="slice" id="slice" d=""/>
        <g class="ticks" id="ticks"></g>
        <line class="hand" id="hand" x1="100" y1="100" x2="100" y2="29"/>
        <circle class="knob" cx="100" cy="100" r="8"/>
        <circle class="knob-dot" cx="100" cy="100" r="3"/>
      </svg>
    </div>
    <div class="info">
      <p class="status" id="status">남은 시간</p>
      <p class="digits" id="digits"><span class="d">0</span><span class="d">5</span><span class="c">:</span><span class="d">0</span><span class="d">0</span></p>
      <p class="done-title" id="done-title" role="alert" hidden>시간이 끝났어요!</p>
      <div class="actions" id="actions">
        <button type="button" class="btn btn-alarm" id="btn-silence" hidden>알람 끄기</button>
        <button type="button" class="btn" id="btn-pause">일시정지</button>
        <button type="button" class="btn btn-primary" id="btn-extend">연장</button>
        <button type="button" class="btn" id="btn-reset">처음으로</button>
      </div>
      <div class="extend" id="extend-panel" role="group" aria-labelledby="extend-title" hidden>
        <h2 id="extend-title">얼마나 연장할까요?</h2>
        <div class="setter" id="setter-extend">
          <button type="button" class="arrow c1 r1" data-field="min" data-dir="1" aria-label="연장할 분 늘리기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 21 18H3Z"/></svg></button>
          <input class="num c1 r2" id="ext-min" data-field="min" type="text" inputmode="numeric" autocomplete="off" maxlength="2" value="01" aria-label="연장할 분">
          <button type="button" class="arrow c1 r3" data-field="min" data-dir="-1" aria-label="연장할 분 줄이기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19 3 6h18Z"/></svg></button>
          <span class="unit-label c1 r4">분</span>
          <span class="colon c2 r2" aria-hidden="true">:</span>
          <button type="button" class="arrow c3 r1" data-field="sec" data-dir="1" aria-label="연장할 초 늘리기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 21 18H3Z"/></svg></button>
          <input class="num c3 r2" id="ext-sec" data-field="sec" type="text" inputmode="numeric" autocomplete="off" maxlength="2" value="00" aria-label="연장할 초">
          <button type="button" class="arrow c3 r3" data-field="sec" data-dir="-1" aria-label="연장할 초 줄이기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19 3 6h18Z"/></svg></button>
          <span class="unit-label c3 r4">초</span>
        </div>
        <p class="hint">시간을 정할 때와 똑같이 숫자를 쓰거나 ▲ ▼ 화살표로 정해요.</p>
        <p class="msg" id="extend-msg" role="alert" hidden></p>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="btn-extend-ok">연장하기</button>
          <button type="button" class="btn" id="btn-extend-cancel">취소</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';
  document.documentElement.lang = 'ko';

  const $ = (id) => document.getElementById(id);
  const app = $('app'), vSetup = $('view-setup'), vClock = $('view-clock');
  const clockSvg = $('clock'), clockWrap = $('clock-wrap'), sliceEl = $('slice'), handEl = $('hand');
  const statusEl = $('status'), digitsEl = $('digits'), doneEl = $('done-title');
  const actionsEl = $('actions'), extPanel = $('extend-panel');
  const btnStart = $('btn-start'), btnPause = $('btn-pause'), btnExtend = $('btn-extend');
  const btnReset = $('btn-reset'), btnSilence = $('btn-silence');
  const btnExtOk = $('btn-extend-ok'), btnExtCancel = $('btn-extend-cancel');
  const setupMsg = $('setup-msg'), extMsg = $('extend-msg');

  const MAX_SEC = 99 * 60 + 59;
  const pad = (n) => String(n).padStart(2, '0');
  const now = () => performance.now();

  // 타이머 상태: setup(시간 정하기) → running(흐르는 중) ⇄ paused(멈춤) → ended(끝)
  const S = { state: 'setup', totalMs: 0, remainingMs: 0, endAt: 0, extendOpen: false, ringing: false };
  const remaining = () =>
    S.state === 'running' ? Math.max(0, S.endAt - now()) : (S.state === 'paused' ? S.remainingMs : 0);

  /* ---------- 시계 눈금 60개 (5분마다 굵게) ---------- */
  (function drawTicks() {
    const g = $('ticks'), NS = 'http://www.w3.org/2000/svg';
    for (let i = 0; i < 60; i++) {
      const a = i * Math.PI / 30, major = i % 5 === 0;
      const r1 = 88, r2 = major ? 77 : 83.5;
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', (100 + r1 * Math.sin(a)).toFixed(2));
      line.setAttribute('y1', (100 - r1 * Math.cos(a)).toFixed(2));
      line.setAttribute('x2', (100 + r2 * Math.sin(a)).toFixed(2));
      line.setAttribute('y2', (100 - r2 * Math.cos(a)).toFixed(2));
      line.setAttribute('stroke-width', major ? '3' : '1.4');
      g.appendChild(line);
    }
  })();

  /* ---------- ▲▼ 버튼: 한 번 누르면 1씩, 꾹 누르면 빠르게 ---------- */
  function holdToRepeat(btn, fn) {
    let t1 = 0, t2 = 0;
    const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = 0; };
    btn.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      stop();
      fn();
      t1 = setTimeout(() => { t2 = setInterval(fn, 80); }, 420);
    });
    ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach((ev) => btn.addEventListener(ev, stop));
    btn.addEventListener('click', (e) => { if (e.detail === 0) fn(); }); // 키보드로 누를 때
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  /* ---------- 시간 정하기 칸 (처음 설정과 연장이 같은 방식) ---------- */
  function makeSetter(root, onEnter) {
    const inp = {
      min: root.querySelector('input[data-field="min"]'),
      sec: root.querySelector('input[data-field="sec"]')
    };
    const toInt = (el) => { const n = parseInt(el.value, 10); return isNaN(n) ? 0 : n; };
    const write = (m, s) => { inp.min.value = pad(m); inp.sec.value = pad(s); };

    // 초에 75처럼 60 이상을 쓰면 1분 15초로 바꿔 줘요.
    function normalize() {
      const total = Math.min(MAX_SEC, toInt(inp.min) * 60 + toInt(inp.sec));
      write(Math.floor(total / 60), total % 60);
      return total * 1000;
    }
    function step(field, dir) {
      const total = Math.min(MAX_SEC, toInt(inp.min) * 60 + toInt(inp.sec));
      let m = Math.floor(total / 60), s = total % 60;
      if (field === 'min') {
        m = Math.max(0, Math.min(99, m + dir));
      } else {
        s += dir;
        if (s > 59) { if (m < 99) { s = 0; m += 1; } else { s = 59; } }
        else if (s < 0) { if (m > 0) { s = 59; m -= 1; } else { s = 0; } }
      }
      write(m, s);
    }

    root.querySelectorAll('.arrow').forEach((btn) =>
      holdToRepeat(btn, () => step(btn.dataset.field, Number(btn.dataset.dir))));

    [inp.min, inp.sec].forEach((el) => {
      el.addEventListener('input', () => {
        const v = el.value.replace(/\D/g, '').slice(0, 2);
        if (v !== el.value) el.value = v;
      });
      el.addEventListener('focus', () => setTimeout(() => { try { el.select(); } catch (e) {} }, 0));
      el.addEventListener('blur', normalize);
      el.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          e.preventDefault();
          step(el.dataset.field, e.key === 'ArrowUp' ? 1 : -1);
          el.select();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          onEnter();
        }
      });
    });
    return { normalize, focus: () => inp.min.focus() };
  }

  /* ---------- 시계 그리기 ---------- */
  const CX = 100, CY = 100, R = 75, HAND = 71;
  // 남은 시간만큼 보라색 부채꼴이 남고, 바늘이 시계 방향으로 돌며 줄여 나가요.
  function slicePath(f) {
    if (f <= 0.0005) return '';
    if (f >= 0.9995) {
      return `M${CX} ${CY - R}A${R} ${R} 0 1 1 ${CX} ${CY + R}A${R} ${R} 0 1 1 ${CX} ${CY - R}Z`;
    }
    const a = (1 - f) * 2 * Math.PI;
    const x = CX + R * Math.sin(a), y = CY - R * Math.cos(a);
    return `M${CX} ${CY}L${x.toFixed(3)} ${y.toFixed(3)}A${R} ${R} 0 ${f > 0.5 ? 1 : 0} 1 ${CX} ${CY - R}Z`;
  }

  let lastText = '';
  function showDigits(ms) {
    const total = Math.ceil(ms / 1000);
    const m = Math.floor(total / 60), s = total % 60;
    const text = pad(m) + ':' + pad(s);
    if (text === lastText) return;
    lastText = text;
    digitsEl.innerHTML = Array.from(text, (ch) =>
      ch === ':' ? '<span class="c">:</span>' : '<span class="d">' + ch + '</span>').join('');
    digitsEl.setAttribute('aria-label', '남은 시간 ' + m + '분 ' + s + '초');
    if (S.state === 'running' || S.state === 'paused') document.title = text + ' · 타이머';
  }

  function draw(ms) {
    const f = S.totalMs > 0 ? Math.min(1, ms / S.totalMs) : 0;
    sliceEl.setAttribute('d', slicePath(f));
    const a = (1 - f) * 2 * Math.PI;
    handEl.setAttribute('x2', (CX + HAND * Math.sin(a)).toFixed(3));
    handEl.setAttribute('y2', (CY - HAND * Math.cos(a)).toFixed(3));
    showDigits(ms);
  }

  let raf = 0;
  function frame() {
    raf = 0;
    if (S.state !== 'running') return;
    const ms = remaining();
    if (ms <= 0) { finish(); return; }
    draw(ms);
    raf = requestAnimationFrame(frame);
  }
  function loop() { if (!raf && S.state === 'running') raf = requestAnimationFrame(frame); }
  // 창을 내려 두어도 시간이 끝나는 순간을 놓치지 않게 따로 확인해요.
  setInterval(() => {
    if (S.state !== 'running') return;
    const ms = remaining();
    if (ms <= 0) finish(); else showDigits(ms);
  }, 250);

  /* ---------- 알람 소리 (삐삐삐삐, 최대 30초) ---------- */
  let ctx = null;
  function unlockAudio() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      g.gain.value = 0.0001;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.02);
    } catch (e) { /* 소리를 못 내는 기기에서도 타이머는 그대로 움직여요 */ }
  }
  function tone(t, dur, freq) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.015);
    g.gain.setValueAtTime(0.5, t + dur - 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function ringOnce() {
    if (!ctx) return;
    try {
      if (ctx.state === 'suspended') ctx.resume();
      const t = ctx.currentTime + 0.03;
      for (let i = 0; i < 4; i++) tone(t + i * 0.16, 0.1, 1046);
    } catch (e) {}
  }
  let alarmTimer = 0, rings = 0;
  const RING_LIMIT = 30;
  function startAlarm() {
    stopAlarm();
    S.ringing = true;
    rings = 0;
    const ring = () => {
      if (rings >= RING_LIMIT) { stopAlarm(); render(); return; }
      rings += 1;
      ringOnce();
    };
    ring();
    alarmTimer = setInterval(ring, 1000);
  }
  function stopAlarm() { clearInterval(alarmTimer); alarmTimer = 0; S.ringing = false; }

  /* ---------- 타이머가 도는 동안 화면이 꺼지지 않게 ---------- */
  let wake = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      }
    } catch (e) { wake = null; }
  }
  function letSleep() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && S.state === 'running') { keepAwake(); loop(); }
  });

  /* ---------- 화면 바꾸기 ---------- */
  function render() {
    const st = S.state, active = st === 'running' || st === 'paused', ended = st === 'ended';
    app.dataset.state = st;
    vSetup.hidden = st !== 'setup';
    vClock.hidden = st === 'setup';
    statusEl.hidden = ended;
    statusEl.textContent = st === 'paused' ? '잠깐 멈췄어요' : '남은 시간';
    digitsEl.hidden = ended;
    doneEl.hidden = !ended;
    btnPause.hidden = !active;
    btnPause.textContent = st === 'paused' ? '계속' : '일시정지';
    btnSilence.hidden = !(ended && S.ringing);
    actionsEl.hidden = S.extendOpen;
    extPanel.hidden = !S.extendOpen;
    clockSvg.classList.toggle('is-paused', st === 'paused');
    clockSvg.classList.toggle('is-ended', ended);
    clockWrap.classList.toggle('is-ringing', ended && S.ringing);
  }

  function startRun(ms) {
    stopAlarm();
    S.totalMs = ms; S.remainingMs = ms; S.endAt = now() + ms;
    S.state = 'running'; S.extendOpen = false;
    lastText = '';
    render(); draw(ms); loop(); keepAwake();
  }

  function finish() {
    if (S.state !== 'running') return;
    S.state = 'ended'; S.remainingMs = 0; S.extendOpen = false;
    draw(0);
    startAlarm();
    render();
    letSleep();
    document.title = '시간 끝! · 타이머';
  }

  const showMsg = (el, text) => { el.textContent = text; el.hidden = false; };
  const hideMsg = (el) => { el.hidden = true; };

  const mainSetter = makeSetter($('setter-main'), () => btnStart.click());
  const extSetter = makeSetter($('setter-extend'), () => btnExtOk.click());

  btnStart.addEventListener('click', (e) => {
    const ms = mainSetter.normalize();
    if (ms <= 0) { showMsg(setupMsg, '시간을 1초 이상으로 정해 주세요.'); return; }
    hideMsg(setupMsg);
    unlockAudio();
    startRun(ms);
    if (e.detail === 0) btnPause.focus();
  });

  btnPause.addEventListener('click', () => {
    if (S.state === 'running') {
      S.remainingMs = remaining(); S.state = 'paused'; letSleep();
    } else if (S.state === 'paused') {
      S.endAt = now() + S.remainingMs; S.state = 'running'; keepAwake(); loop();
    }
    render(); draw(remaining());
  });

  btnExtend.addEventListener('click', (e) => {
    stopAlarm();
    S.extendOpen = true;
    hideMsg(extMsg);
    render();
    if (e.detail === 0) extSetter.focus();
  });

  btnExtCancel.addEventListener('click', (e) => {
    S.extendOpen = false;
    render();
    if (e.detail === 0) btnExtend.focus();
  });

  btnExtOk.addEventListener('click', (e) => {
    const add = extSetter.normalize();
    if (add <= 0) { showMsg(extMsg, '연장할 시간을 1초 이상으로 정해 주세요.'); return; }
    unlockAudio();
    if (S.state === 'ended') {
      startRun(add); // 끝난 뒤 연장하면 연장한 시간으로 다시 시작해요.
    } else {
      if (S.state === 'running') S.endAt += add; else S.remainingMs += add;
      S.totalMs += add;
      S.extendOpen = false;
      render(); draw(remaining());
    }
    if (e.detail === 0) btnExtend.focus();
  });

  btnReset.addEventListener('click', (e) => {
    stopAlarm(); letSleep();
    S.state = 'setup'; S.extendOpen = false;
    render();
    document.title = '타이머';
    if (e.detail === 0) btnStart.focus();
  });

  btnSilence.addEventListener('click', () => { stopAlarm(); render(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && S.extendOpen) btnExtCancel.click();
  });

  render();
})();
</script>
</body>
</html>
