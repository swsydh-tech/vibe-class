<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신나는 가위바위보 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Korean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for Victory Celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            background-color: #d9f99d; /* 연두색 배경 (Tailwind lime-200) */
            background-image: radial-gradient(#bef264 2px, transparent 2px);
            background-size: 24px 24px;
        }

        /* 손 흔들기 애니메이션 */
        @keyframes shakeLeft {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-20deg) scale(1.1); }
            75% { transform: rotate(20deg) scale(1.1); }
        }

        @keyframes shakeRight {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(20deg) scale(1.1); }
            75% { transform: rotate(-20deg) scale(1.1); }
        }

        .animate-shake-left {
            animation: shakeLeft 0.5s infinite ease-in-out;
        }

        .animate-shake-right {
            animation: shakeRight 0.5s infinite ease-in-out;
        }

        /* 통통 튀는 애니메이션 */
        @keyframes bounceGently {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .animate-bounce-gentle {
            animation: bounceGently 2s infinite ease-in-out;
        }

        /* 펄스 빛 효과 */
        .glow-win {
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
        }
        .glow-lose {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
        }
        .glow-draw {
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.6);
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #84cc16;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 text-gray-800 select-none">

    <!-- 상단 헤더 -->
    <header class="w-full max-w-xl text-center my-2">
        <div class="inline-block bg-white/90 backdrop-blur-md px-6 py-2 rounded-full shadow-lg border-2 border-lime-400 animate-bounce-gentle">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-lime-700 tracking-wide flex items-center justify-center gap-2">
                <span>✌️</span> <span>가위바위보 게임</span> <span>✊</span> <span>🖐️</span>
            </h1>
        </div>
    </header>

    <!-- 스코어 현황판 -->
    <section class="w-full max-w-xl bg-white/90 backdrop-blur-md rounded-2xl p-4 shadow-xl border-4 border-lime-300 my-2">
        <div class="grid grid-cols-4 gap-2 text-center">
            <div class="bg-lime-50 p-2 rounded-xl border border-lime-200">
                <p class="text-xs sm:text-sm text-lime-800 font-bold">전체 판수</p>
                <p id="total-count" class="text-xl sm:text-2xl font-black text-lime-900">0</p>
            </div>
            <div class="bg-emerald-50 p-2 rounded-xl border border-emerald-200">
                <p class="text-xs sm:text-sm text-emerald-800 font-bold">승리</p>
                <p id="win-count" class="text-xl sm:text-2xl font-black text-emerald-600">0</p>
            </div>
            <div class="bg-amber-50 p-2 rounded-xl border border-amber-200">
                <p class="text-xs sm:text-sm text-amber-800 font-bold">무승부</p>
                <p id="draw-count" class="text-xl sm:text-2xl font-black text-amber-600">0</p>
            </div>
            <div class="bg-rose-50 p-2 rounded-xl border border-rose-200">
                <p class="text-xs sm:text-sm text-rose-800 font-bold">패배</p>
                <p id="lose-count" class="text-xl sm:text-2xl font-black text-rose-600">0</p>
            </div>
        </div>
        <!-- 승률 바 -->
        <div class="mt-3">
            <div class="flex justify-between text-xs font-bold text-gray-600 mb-1">
                <span>승률</span>
                <span id="win-rate-text">0%</span>
            </div>
            <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden">
                <div id="win-rate-bar" class="bg-gradient-to-r from-emerald-400 to-lime-500 h-full w-0% transition-all duration-500"></div>
            </div>
        </div>
    </section>

    <!-- 메인 게임 영역 -->
    <main class="w-full max-w-xl bg-white/95 backdrop-blur-md rounded-3xl p-6 shadow-2xl border-4 border-lime-400 my-2 flex flex-col items-center">
        
        <!-- 대결 결과 메시지 (큰 글씨) -->
        <div class="w-full text-center mb-6">
            <p id="status-subtext" class="text-base sm:text-lg text-gray-500 font-bold min-h-[28px]">
                버튼을 눌러 가위, 바위, 보 중 하나를 선택하세요!
            </p>
            <h2 id="result-message" class="text-4xl sm:text-5xl font-black tracking-wider text-lime-800 min-h-[60px] flex items-center justify-center transition-all duration-300">
                준비 되셨나요?
            </h2>
        </div>

        <!-- 플레이어 vs 컴퓨터 대결창 -->
        <div class="w-full grid grid-cols-2 gap-4 items-center mb-8 relative">
            <!-- VS 배지 -->
            <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10 bg-amber-400 text-white font-black text-xl sm:text-2xl w-12 h-12 rounded-full flex items-center justify-center border-4 border-white shadow-lg">
                VS
            </div>

            <!-- 플레이어 섹션 -->
            <div id="player-box" class="flex flex-col items-center bg-lime-50 rounded-2xl p-4 border-2 border-lime-200 transition-all duration-300">
                <span class="text-sm sm:text-base font-bold text-lime-800 mb-2 flex items-center gap-1">
                    👤 나 (Player)
                </span>
                <div id="player-card" class="w-24 h-24 sm:w-32 sm:h-32 bg-white rounded-2xl shadow-inner border-2 border-lime-300 flex items-center justify-center p-3 transition-transform duration-300">
                    <!-- 기본 대기 상태 SVG (질문 상자) -->
                    <svg id="player-svg-default" class="w-16 h-16 text-lime-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <!-- 선택 결과 아이콘 삽입 영역 -->
                    <div id="player-icon-container" class="hidden w-full h-full flex items-center justify-center"></div>
                </div>
                <p id="player-choice-label" class="mt-2 text-lg font-bold text-gray-700">대기 중...</p>
            </div>

            <!-- 컴퓨터 섹션 -->
            <div id="computer-box" class="flex flex-col items-center bg-emerald-50 rounded-2xl p-4 border-2 border-emerald-200 transition-all duration-300">
                <span class="text-sm sm:text-base font-bold text-emerald-800 mb-2 flex items-center gap-1">
                    🤖 컴퓨터 (AI)
                </span>
                <div id="computer-card" class="w-24 h-24 sm:w-32 sm:h-32 bg-white rounded-2xl shadow-inner border-2 border-emerald-300 flex items-center justify-center p-3 transition-transform duration-300">
                    <!-- 기본 대기 상태 SVG -->
                    <svg id="computer-svg-default" class="w-16 h-16 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <!-- 선택 결과 아이콘 삽입 영역 -->
                    <div id="computer-icon-container" class="hidden w-full h-full flex items-center justify-center"></div>
                </div>
                <p id="computer-choice-label" class="mt-2 text-lg font-bold text-gray-700">생각 중...</p>
            </div>
        </div>

        <!-- 입력 선택 버튼 영역 -->
        <div class="w-full">
            <p class="text-center text-gray-600 font-bold mb-3">👇 무엇을 내시겠습니까?</p>
            <div class="grid grid-cols-3 gap-3 sm:gap-4">
                
                <!-- 가위 버튼 -->
                <button onclick="playGame('scissors')" class="btn-choice group relative bg-gradient-to-b from-amber-300 to-amber-400 hover:from-amber-400 hover:to-amber-500 active:scale-95 text-amber-950 font-black p-3 sm:p-4 rounded-2xl shadow-lg hover:shadow-xl transition-all border-b-4 border-amber-600 flex flex-col items-center gap-2">
                    <div class="w-12 h-12 sm:w-16 sm:h-16 bg-white/80 rounded-full flex items-center justify-center p-2 group-hover:scale-110 transition-transform">
                        <!-- 가위 SVG -->
                        <svg class="w-full h-full text-amber-600" viewBox="0 0 64 64" fill="currentColor">
                            <path d="M48 12c-3.31 0-6 2.69-6 6 0 1.25.39 2.41 1.05 3.37L31 33.42l-5.63-5.63C26.34 26.69 27 25.42 27 24c0-3.31-2.69-6-6-6s-6 2.69-6 6 2.69 6 6 6c1.42 0 2.69-.66 3.79-1.63L31 39.05l12.05 12.05C42.39 52.06 42 53.22 42 54.47c0 3.31 2.69 6 6 6s6-2.69 6-6-2.69-6-6-6c-1.25 0-2.41.39-3.37 1.05L31 36.87l3.63-3.63 10.05 10.05C43.69 44.34 43 45.61 43 47c0 3.31 2.69 6 6 6s6-2.69 6-6-2.69-6-6-6c-1.42 0-2.69.66-3.79 1.63L33.74 31.55l10.9-10.9C45.59 21.61 46.75 22 48 22c3.31 0 6-2.69 6-6s-2.69-6-6-6zm-33 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm33 28c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm0-40c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/>
                        </svg>
                    </div>
                    <span class="text-lg sm:text-xl tracking-wider">가위</span>
                </button>

                <!-- 바위 버튼 -->
                <button onclick="playGame('rock')" class="btn-choice group relative bg-gradient-to-b from-blue-400 to-blue-500 hover:from-blue-500 hover:to-blue-600 active:scale-95 text-blue-950 font-black p-3 sm:p-4 rounded-2xl shadow-lg hover:shadow-xl transition-all border-b-4 border-blue-700 flex flex-col items-center gap-2">
                    <div class="w-12 h-12 sm:w-16 sm:h-16 bg-white/80 rounded-full flex items-center justify-center p-2 group-hover:scale-110 transition-transform">
                        <!-- 바위(주먹) SVG -->
                        <svg class="w-full h-full text-blue-600" viewBox="0 0 64 64" fill="currentColor">
                            <path d="M52 28h-4V16c0-2.21-1.79-4-4-4s-4 1.79-4 4v8h-2V12c0-2.21-1.79-4-4-4s-4 1.79-4 4v12h-2V16c0-2.21-1.79-4-4-4s-4 1.79-4 4v16h-2c-2.21 0-4 1.79-4 4v8c0 11.05 8.95 20 20 20h2c11.05 0 20-8.95 20-20V32c0-2.21-1.79-4-4-4z"/>
                        </svg>
                    </div>
                    <span class="text-lg sm:text-xl tracking-wider">바위</span>
                </button>

                <!-- 보 버튼 -->
                <button onclick="playGame('paper')" class="btn-choice group relative bg-gradient-to-b from-rose-300 to-rose-400 hover:from-rose-400 hover:to-rose-500 active:scale-95 text-rose-950 font-black p-3 sm:p-4 rounded-2xl shadow-lg hover:shadow-xl transition-all border-b-4 border-rose-600 flex flex-col items-center gap-2">
                    <div class="w-12 h-12 sm:w-16 sm:h-16 bg-white/80 rounded-full flex items-center justify-center p-2 group-hover:scale-110 transition-transform">
                        <!-- 보(보자기) SVG -->
                        <svg class="w-full h-full text-rose-600" viewBox="0 0 64 64" fill="currentColor">
                            <path d="M52 20c-2.21 0-4 1.79-4 4v12h-2V12c0-2.21-1.79-4-4-4s-4 1.79-4 4v24h-2V8c0-2.21-1.79-4-4-4s-4 1.79-4 4v28h-2V12c0-2.21-1.79-4-4-4s-4 1.79-4 4v28h-2V20c0-2.21-1.79-4-4-4s-4 1.79-4 4v24c0 11.05 8.95 20 20 20h4c11.05 0 20-8.95 20-20V24c0-2.21-1.79-4-4-4z"/>
                        </svg>
                    </div>
                    <span class="text-lg sm:text-xl tracking-wider">보</span>
                </button>

            </div>
        </div>

    </main>

    <!-- 하단 기능 컨트롤 & 기록 -->
    <footer class="w-full max-w-xl flex flex-col gap-3 my-2">
        <!-- 최근 기록 판 -->
        <div class="bg-white/90 backdrop-blur-md rounded-2xl p-4 shadow-md border-2 border-lime-300">
            <div class="flex justify-between items-center mb-2">
                <h3 class="font-bold text-gray-700 text-sm flex items-center gap-1">
                    📜 최근 경기 기록 (최대 5회)
                </h3>
                <button onclick="resetStats()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-3 py-1 rounded-full transition">
                    전적 초기화
                </button>
            </div>
            <div id="history-list" class="flex gap-2 overflow-x-auto py-1 min-h-[42px] items-center text-xs text-gray-500">
                <span>아직 진행된 경기가 없습니다.</span>
            </div>
        </div>

        <div class="text-center text-xs font-bold text-lime-800">
            💚 재미있는 가위바위보 웹앱 | 만들어진 연두색 테마
        </div>
    </footer>

    <script>
        /* ============================================================
           가위바위보 게임 로직 & 효과음 (Audio Synth) & UI 조작
           ============================================================ */

        // SVG 그래픽 정의 (가위, 바위, 보)
        const choiceGraphics = {
            scissors: {
                name: "가위",
                color: "amber",
                svg: `<svg class="w-full h-full text-amber-500 transform -scale-x-100" viewBox="0 0 64 64" fill="currentColor">
                        <path d="M48 12c-3.31 0-6 2.69-6 6 0 1.25.39 2.41 1.05 3.37L31 33.42l-5.63-5.63C26.34 26.69 27 25.42 27 24c0-3.31-2.69-6-6-6s-6 2.69-6 6 2.69 6 6 6c1.42 0 2.69-.66 3.79-1.63L31 39.05l12.05 12.05C42.39 52.06 42 53.22 42 54.47c0 3.31 2.69 6 6 6s6-2.69 6-6-2.69-6-6-6c-1.25 0-2.41.39-3.37 1.05L31 36.87l3.63-3.63 10.05 10.05C43.69 44.34 43 45.61 43 47c0 3.31 2.69 6 6 6s6-2.69 6-6-2.69-6-6-6c-1.42 0-2.69.66-3.79 1.63L33.74 31.55l10.9-10.9C45.59 21.61 46.75 22 48 22c3.31 0 6-2.69 6-6s-2.69-6-6-6zm-33 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm33 28c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm0-40c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/>
                      </svg>`
            },
            rock: {
                name: "바위",
                color: "blue",
                svg: `<svg class="w-full h-full text-blue-500" viewBox="0 0 64 64" fill="currentColor">
                        <path d="M52 28h-4V16c0-2.21-1.79-4-4-4s-4 1.79-4 4v8h-2V12c0-2.21-1.79-4-4-4s-4 1.79-4 4v12h-2V16c0-2.21-1.79-4-4-4s-4 1.79-4 4v16h-2c-2.21 0-4 1.79-4 4v8c0 11.05 8.95 20 20 20h2c11.05 0 20-8.95 20-20V32c0-2.21-1.79-4-4-4z"/>
                      </svg>`
            },
            paper: {
                name: "보",
                color: "rose",
                svg: `<svg class="w-full h-full text-rose-500" viewBox="0 0 64 64" fill="currentColor">
                        <path d="M52 20c-2.21 0-4 1.79-4 4v12h-2V12c0-2.21-1.79-4-4-4s-4 1.79-4 4v24h-2V8c0-2.21-1.79-4-4-4s-4 1.79-4 4v28h-2V12c0-2.21-1.79-4-4-4s-4 1.79-4 4v28h-2V20c0-2.21-1.79-4-4-4s-4 1.79-4 4v24c0 11.05 8.95 20 20 20h4c11.05 0 20-8.95 20-20V24c0-2.21-1.79-4-4-4z"/>
                      </svg>`
            }
        };

        // 전적 상태 변수
        let stats = {
            total: 0,
            win: 0,
            draw: 0,
            lose: 0
        };

        let history = [];
        let isPlaying = false;

        // 웹 오디오 API를 통한 효과음 합성기 (Sound Effects Generator)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'shake') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.setValueAtTime(300, now + 0.05);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'win') {
                // 승리 팡파레
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const subOsc = audioCtx.createOscillator();
                    const subGain = audioCtx.createGain();
                    subOsc.connect(subGain);
                    subGain.connect(audioCtx.destination);

                    const startTime = now + idx * 0.1;
                    subOsc.type = 'triangle';
                    subOsc.frequency.setValueAtTime(freq, startTime);
                    subGain.gain.setValueAtTime(0.3, startTime);
                    subGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);

                    subOsc.start(startTime);
                    subOsc.stop(startTime + 0.25);
                });
            } else if (type === 'lose') {
                // 패배음
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.35);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'draw') {
                // 무승부음
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(440, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        // 가위바위보 판정 함수
        function getResult(player, computer) {
            if (player === computer) return 'draw';
            if (
                (player === 'rock' && computer === 'scissors') ||
                (player === 'scissors' && computer === 'paper') ||
                (player === 'paper' && computer === 'rock')
            ) {
                return 'win';
            }
            return 'lose';
        }

        // 게임 실행 함수
        function playGame(playerChoice) {
            if (isPlaying) return;
            isPlaying = true;

            playSound('click');

            // 버튼 비활성화 효과
            const buttons = document.querySelectorAll('.btn-choice');
            buttons.forEach(b => b.classList.add('opacity-50', 'pointer-events-none'));

            // 카드가 있는 박스 가져오기
            const playerCard = document.getElementById('player-card');
            const computerCard = document.getElementById('computer-card');
            const playerSvgDefault = document.getElementById('player-svg-default');
            const computerSvgDefault = document.getElementById('computer-svg-default');
            const playerIconContainer = document.getElementById('player-icon-container');
            const computerIconContainer = document.getElementById('computer-icon-container');
            const resultMsg = document.getElementById('result-message');
            const statusSubtext = document.getElementById('status-subtext');
            const playerBox = document.getElementById('player-box');
            const computerBox = document.getElementById('computer-box');

            // 박스 강조 클래스 초기화
            playerBox.className = "flex flex-col items-center bg-lime-50 rounded-2xl p-4 border-2 border-lime-200 transition-all duration-300";
            computerBox.className = "flex flex-col items-center bg-emerald-50 rounded-2xl p-4 border-2 border-emerald-200 transition-all duration-300";

            // 카운트다운 및 흔들기 애니메이션
            playerSvgDefault.classList.add('hidden');
            computerSvgDefault.classList.add('hidden');
            
            // 주먹(바위) 모양으로 카운트다운 시작
            playerIconContainer.classList.remove('hidden');
            computerIconContainer.classList.remove('hidden');
            playerIconContainer.innerHTML = choiceGraphics.rock.svg;
            computerIconContainer.innerHTML = choiceGraphics.rock.svg;

            document.getElementById('player-choice-label').innerText = "안 내면 진 거...";
            document.getElementById('computer-choice-label').innerText = "생각 중...";
            
            statusSubtext.innerText = "가위... 바위...";
            resultMsg.className = "text-4xl sm:text-5xl font-black text-amber-600 min-h-[60px] flex items-center justify-center animate-bounce";
            resultMsg.innerText = "가위... 바위...";

            // 흔들기 애니메이션 추가
            playerCard.classList.add('animate-shake-left');
            computerCard.classList.add('animate-shake-right');

            let countdownStep = 0;
            const shakeInterval = setInterval(() => {
                countdownStep++;
                playSound('shake');
                if (countdownStep === 2) {
                    statusSubtext.innerText = "보...!";
                    resultMsg.innerText = "보...!";
                }
            }, 300);

            // 0.9초 후 컴퓨터 선택 및 결과 발표
            setTimeout(() => {
                clearInterval(shakeInterval);

                // 흔들기 제거
                playerCard.classList.remove('animate-shake-left');
                computerCard.classList.remove('animate-shake-right');

                // 컴퓨터 랜덤 선택
                const choices = ['scissors', 'rock', 'paper'];
                const computerChoice = choices[Math.floor(Math.random() * choices.length)];

                // 아이콘 결과 업데이트
                playerIconContainer.innerHTML = choiceGraphics[playerChoice].svg;
                computerIconContainer.innerHTML = choiceGraphics[computerChoice].svg;

                document.getElementById('player-choice-label').innerText = choiceGraphics[playerChoice].name;
                document.getElementById('computer-choice-label').innerText = choiceGraphics[computerChoice].name;

                // 결과 계산
                const result = getResult(playerChoice, computerChoice);

                // 승패에 따른 대형 문구 & 스타일 적용
                if (result === 'win') {
                    resultMsg.innerText = "🎉 이겼습니다! 🎉";
                    resultMsg.className = "text-4xl sm:text-6xl font-black text-emerald-600 min-h-[60px] flex items-center justify-center scale-110 transition-transform duration-300";
                    statusSubtext.innerText = `${choiceGraphics[playerChoice].name}(이)가 ${choiceGraphics[computerChoice].name}(을)를 이겼습니다!`;
                    
                    playerBox.classList.add('glow-win', 'border-emerald-500', 'bg-emerald-100');
                    playSound('win');

                    // 축하 가루 효과 (Confetti)
                    if (typeof confetti === 'function') {
                        confetti({
                            particleCount: 70,
                            spread: 60,
                            origin: { y: 0.7 }
                        });
                    }

                    stats.win++;
                } else if (result === 'lose') {
                    resultMsg.innerText = "😭 졌습니다...";
                    resultMsg.className = "text-4xl sm:text-6xl font-black text-rose-600 min-h-[60px] flex items-center justify-center scale-100 transition-transform duration-300";
                    statusSubtext.innerText = `${choiceGraphics[computerChoice].name}(이)가 ${choiceGraphics[playerChoice].name}(을)를 이겼습니다.`;
                    
                    computerBox.classList.add('glow-lose', 'border-rose-500', 'bg-rose-100');
                    playSound('lose');

                    stats.lose++;
                } else {
                    resultMsg.innerText = "🤝 비겼습니다!";
                    resultMsg.className = "text-4xl sm:text-6xl font-black text-amber-500 min-h-[60px] flex items-center justify-center transition-transform duration-300";
                    statusSubtext.innerText = "둘 다 같은 것을 냈습니다. 다시 도전하세요!";
                    
                    playerBox.classList.add('glow-draw');
                    computerBox.classList.add('glow-draw');
                    playSound('draw');

                    stats.draw++;
                }

                stats.total++;
                updateStatsUI();

                // 히스토리 기록 추가
                addHistory(playerChoice, computerChoice, result);

                // 버튼 다시 활성화
                buttons.forEach(b => b.classList.remove('opacity-50', 'pointer-events-none'));
                isPlaying = false;

            }, 900);
        }

        // 통계 UI 업데이트
        function updateStatsUI() {
            document.getElementById('total-count').innerText = stats.total;
            document.getElementById('win-count').innerText = stats.win;
            document.getElementById('draw-count').innerText = stats.draw;
            document.getElementById('lose-count').innerText = stats.lose;

            const winRate = stats.total > 0 ? Math.round((stats.win / stats.total) * 100) : 0;
            document.getElementById('win-rate-text').innerText = `${winRate}%`;
            document.getElementById('win-rate-bar').style.width = `${winRate}%`;
        }

        // 히스토리 추가
        function addHistory(player, computer, result) {
            const historyList = document.getElementById('history-list');
            
            if (history.length === 0) {
                historyList.innerHTML = '';
            }

            const pName = choiceGraphics[player].name;
            const cName = choiceGraphics[computer].name;

            let badgeColor = '';
            let resultTag = '';

            if (result === 'win') {
                badgeColor = 'bg-emerald-100 text-emerald-800 border-emerald-300';
                resultTag = '승';
            } else if (result === 'lose') {
                badgeColor = 'bg-rose-100 text-rose-800 border-rose-300';
                resultTag = '패';
            } else {
                badgeColor = 'bg-amber-100 text-amber-800 border-amber-300';
                resultTag = '무';
            }

            const item = {
                text: `${pName} vs ${cName}`,
                resultTag,
                badgeColor
            };

            history.unshift(item);
            if (history.length > 5) history.pop();

            // 리스트 다시 그리기
            historyList.innerHTML = history.map(h => `
                <div class="flex items-center gap-1.5 px-3 py-1 rounded-full border text-xs font-bold whitespace-nowrap shadow-sm ${h.badgeColor}">
                    <span>${h.text}</span>
                    <span class="px-1.5 py-0.5 rounded-full bg-white/80 text-[10px]">${h.resultTag}</span>
                </div>
            `).join('');
        }

        // 전적 초기화
        function resetStats() {
            playSound('click');
            stats = { total: 0, win: 0, draw: 0, lose: 0 };
            history = [];
            updateStatsUI();

            document.getElementById('history-list').innerHTML = '<span>아직 진행된 경기가 없습니다.</span>';
            
            // 기본 상태로 리셋
            document.getElementById('player-svg-default').classList.remove('hidden');
            document.getElementById('computer-svg-default').classList.remove('hidden');
            document.getElementById('player-icon-container').classList.add('hidden');
            document.getElementById('computer-icon-container').classList.add('hidden');
            document.getElementById('player-choice-label').innerText = "대기 중...";
            document.getElementById('computer-choice-label').innerText = "생각 중...";
            
            document.getElementById('result-message').innerText = "준비 되셨나요?";
            document.getElementById('result-message').className = "text-4xl sm:text-5xl font-black tracking-wider text-lime-800 min-h-[60px] flex items-center justify-center";
            document.getElementById('status-subtext').innerText = "버튼을 눌러 가위, 바위, 보 중 하나를 선택하세요!";

            document.getElementById('player-box').className = "flex flex-col items-center bg-lime-50 rounded-2xl p-4 border-2 border-lime-200 transition-all duration-300";
            document.getElementById('computer-box').className = "flex flex-col items-center bg-emerald-50 rounded-2xl p-4 border-2 border-emerald-200 transition-all duration-300";
        }
    </script>
</body>
</html>
