<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멋진 가위바위보 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #FEF9E7; /* Soft pastel yellow background */
        }
        
        .font-jua {
            font-family: 'Jua', sans-serif;
        }

        /* Neon & Glow effects for Hand Containers */
        .hand-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px -5px rgba(234, 179, 8, 0.2), 0 8px 10px -6px rgba(234, 179, 8, 0.1);
        }
        
        .hand-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 20px 30px -10px rgba(234, 179, 8, 0.35), 0 10px 15px -5px rgba(234, 179, 8, 0.2);
        }

        .hand-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Shake Animations for Battle Phase */
        @keyframes shakePlayer {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(-20deg) translateY(-15px); }
            75% { transform: rotate(10deg) translateY(10px); }
        }

        @keyframes shakeCpu {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(20deg) translateY(-15px); }
            75% { transform: rotate(-10deg) translateY(10px); }
        }

        .anim-shake-player {
            animation: shakePlayer 0.5s infinite ease-in-out;
        }

        .anim-shake-cpu {
            animation: shakeCpu 0.5s infinite ease-in-out;
        }

        /* Pulse glow for winners */
        @keyframes winnerPulse {
            0%, 100% { box-shadow: 0 0 20px #22c55e, inset 0 0 15px #22c55e; }
            50% { box-shadow: 0 0 40px #22c55e, inset 0 0 25px #22c55e; }
        }

        .winner-glow {
            animation: winnerPulse 1.2s infinite ease-in-out;
            border-color: #22c55e !important;
        }

        /* Glassmorphism containers */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(254, 240, 138, 0.8);
        }

        /* Custom Scrollbar for Logs */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #fef08a;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #f59e0b;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between items-center p-3 sm:p-6 select-none overflow-x-hidden">

    <!-- Header Section -->
    <header class="w-full max-w-4xl text-center mb-4">
        <div class="inline-block bg-amber-200/60 text-amber-900 px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold mb-2 shadow-sm border border-amber-300">
            🏆 먼저 <span class="text-red-600 font-extrabold">10점</span>을 달성하면 최종 승리!
        </div>
        <h1 class="text-3xl sm:text-5xl font-black font-jua text-amber-900 tracking-wider drop-shadow-sm flex items-center justify-center gap-3">
            <span>✊</span> <span>✌️</span> <span>✋</span> 멋진 가위바위보
        </h1>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-4xl flex-1 flex flex-col gap-6 justify-center">

        <!-- Scoreboard Panel -->
        <section class="glass-panel rounded-3xl p-4 sm:p-6 shadow-xl flex items-center justify-around relative overflow-hidden">
            <!-- Player Score -->
            <div class="text-center flex-1">
                <div class="text-xs sm:text-base font-bold text-amber-800 mb-1 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-user text-blue-500"></i> 플레이어
                </div>
                <div id="player-score" class="text-4xl sm:text-6xl font-black font-jua text-blue-600 transition-all duration-300 scale-100">
                    0
                </div>
            </div>

            <!-- VS Badge -->
            <div class="flex flex-col items-center justify-center px-2">
                <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-amber-500 text-white font-black font-jua text-xl sm:text-2xl flex items-center justify-center shadow-lg border-4 border-amber-100 transform -rotate-12">
                    VS
                </div>
                <span class="text-xs text-amber-700 font-bold mt-2">10점 선승</span>
            </div>

            <!-- CPU Score -->
            <div class="text-center flex-1">
                <div class="text-xs sm:text-base font-bold text-amber-800 mb-1 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-robot text-rose-500"></i> AI 컴퓨터
                </div>
                <div id="cpu-score" class="text-4xl sm:text-6xl font-black font-jua text-rose-600 transition-all duration-300 scale-100">
                    0
                </div>
            </div>
        </section>

        <!-- Battle Arena -->
        <section class="glass-panel rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col items-center justify-center relative min-h-[280px]">
            <!-- Status/Message Display -->
            <div id="status-message" class="text-lg sm:text-2xl font-black font-jua text-amber-900 mb-6 text-center h-8 flex items-center justify-center">
                '게임 시작' 버튼을 눌러주세요!
            </div>

            <!-- Hands Display Arena -->
            <div class="w-full flex justify-around items-center gap-2 sm:gap-8">
                <!-- Player Hand Box -->
                <div class="flex flex-col items-center gap-3">
                    <div id="player-hand-card" class="w-28 h-28 sm:w-44 sm:h-44 rounded-2xl bg-gradient-to-br from-blue-50 to-blue-100 border-4 border-blue-300 flex items-center justify-center shadow-inner relative transition-all duration-300">
                        <div id="player-hand-icon" class="text-5xl sm:text-8xl transition-all duration-200">
                            ❓
                        </div>
                    </div>
                    <span class="font-bold text-sm sm:text-lg text-slate-700 font-jua">나의 선택</span>
                </div>

                <div class="text-2xl sm:text-4xl font-black text-amber-300 font-jua animate-pulse">⚡</div>

                <!-- CPU Hand Box -->
                <div class="flex flex-col items-center gap-3">
                    <div id="cpu-hand-card" class="w-28 h-28 sm:w-44 sm:h-44 rounded-2xl bg-gradient-to-br from-rose-50 to-rose-100 border-4 border-rose-300 flex items-center justify-center shadow-inner relative transition-all duration-300">
                        <div id="cpu-hand-icon" class="text-5xl sm:text-8xl transition-all duration-200">
                            ❓
                        </div>
                    </div>
                    <span class="font-bold text-sm sm:text-lg text-slate-700 font-jua">AI의 선택</span>
                </div>
            </div>
        </section>

        <!-- Game Controls & Hand Selection -->
        <section id="game-controls-area" class="flex flex-col items-center gap-4">
            
            <!-- Main Start/Reset Trigger -->
            <button id="start-btn" onclick="startGame()" class="w-full max-w-md py-4 px-8 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-black font-jua text-xl sm:text-2xl rounded-2xl shadow-lg transform active:scale-95 transition-all flex items-center justify-center gap-3 border-b-4 border-amber-800">
                <i class="fa-solid fa-play"></i> 게임 시작하기
            </button>

            <!-- Choices Buttons (Scissors, Rock, Paper) -->
            <div id="choice-buttons" class="w-full grid grid-cols-3 gap-3 sm:gap-6 opacity-50 pointer-events-none transition-all duration-300">
                
                <!-- Scissors Button -->
                <button onclick="playRound('scissors')" class="hand-card bg-white border-4 border-amber-300 hover:border-amber-500 rounded-2xl p-3 sm:p-5 flex flex-col items-center justify-center group">
                    <div class="w-12 h-12 sm:w-20 sm:h-20 flex items-center justify-center bg-amber-100 rounded-full mb-2 group-hover:bg-amber-200 transition-colors">
                        <svg class="w-8 h-8 sm:w-14 sm:h-14 text-amber-600" viewBox="0 0 24 24" fill="currentColor">
                            <!-- SVG Scissors Icon -->
                            <path d="M6 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4zm0 8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4zm9.6-10.4l3.4-3.4c.8-.8.8-2 0-2.8s-2-.8-2.8 0l-5.3 5.3-1.4-1.4 5.3-5.3c1.6-1.6 4.1-1.6 5.7 0 1.6 1.6 1.6 4.1 0 5.7l-3.4 3.4 1.5 1.5zm-3.1 3.1l-1.5 1.5 3.4 3.4c1.6 1.6 4.1 1.6 5.7 0 1.6-1.6 1.6-4.1 0-5.7l-5.3-5.3-1.4 1.4 5.3 5.3c.8.8.8 2 0 2.8s-2 .8-2.8 0l-3.4-3.4z"/>
                        </svg>
                    </div>
                    <span class="font-jua text-lg sm:text-2xl text-amber-900">가위</span>
                    <span class="text-xs text-slate-400 font-semibold hidden sm:inline">(✌️)</span>
                </button>

                <!-- Rock Button -->
                <button onclick="playRound('rock')" class="hand-card bg-white border-4 border-amber-300 hover:border-amber-500 rounded-2xl p-3 sm:p-5 flex flex-col items-center justify-center group">
                    <div class="w-12 h-12 sm:w-20 sm:h-20 flex items-center justify-center bg-amber-100 rounded-full mb-2 group-hover:bg-amber-200 transition-colors">
                        <svg class="w-8 h-8 sm:w-14 sm:h-14 text-amber-700" viewBox="0 0 24 24" fill="currentColor">
                            <!-- SVG Rock Icon -->
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                        </svg>
                    </div>
                    <span class="font-jua text-lg sm:text-2xl text-amber-900">바위</span>
                    <span class="text-xs text-slate-400 font-semibold hidden sm:inline">(✊)</span>
                </button>

                <!-- Paper Button -->
                <button onclick="playRound('paper')" class="hand-card bg-white border-4 border-amber-300 hover:border-amber-500 rounded-2xl p-3 sm:p-5 flex flex-col items-center justify-center group">
                    <div class="w-12 h-12 sm:w-20 sm:h-20 flex items-center justify-center bg-amber-100 rounded-full mb-2 group-hover:bg-amber-200 transition-colors">
                        <svg class="w-8 h-8 sm:w-14 sm:h-14 text-amber-600" viewBox="0 0 24 24" fill="currentColor">
                            <!-- SVG Paper Icon -->
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 16H5V5h14v13zM7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z"/>
                        </svg>
                    </div>
                    <span class="font-jua text-lg sm:text-2xl text-amber-900">보</span>
                    <span class="text-xs text-slate-400 font-semibold hidden sm:inline">(✋)</span>
                </button>

            </div>
        </section>

        <!-- History Log -->
        <section class="glass-panel rounded-2xl p-4 shadow-md max-h-40 flex flex-col">
            <div class="text-xs font-bold text-amber-800 mb-2 flex items-center justify-between border-b border-amber-200 pb-1">
                <span><i class="fa-solid fa-list-ol mr-1"></i> 경기 기록</span>
                <span id="round-count" class="text-amber-600">총 0라운드</span>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-1.5 text-xs sm:text-sm">
                <div class="text-slate-400 text-center py-2 italic">경기가 시작되면 라운드 결과가 이곳에 기록됩니다.</div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center text-xs text-amber-700/80 mt-4 font-semibold">
        가위바위보 게임 &copy; 10점 선승제 대결
    </footer>

    <!-- Victory Modal -->
    <div id="victory-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity duration-300 opacity-0">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-amber-400 transform scale-90 transition-transform duration-300" id="modal-card">
            <div id="modal-icon" class="text-6xl mb-3">🏆</div>
            <h2 id="modal-title" class="text-3xl font-black font-jua text-amber-900 mb-2">최종 승리!</h2>
            <p id="modal-desc" class="text-sm text-slate-600 font-semibold mb-6">축하합니다! 10점을 먼저 달성하여 AI를 누르고 승리하셨습니다!</p>
            <button onclick="resetGame()" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-black font-jua text-xl rounded-xl shadow-md transform active:scale-95 transition-all">
                다시 도전하기 🔄
            </button>
        </div>
    </div>

    <script>
        // Game State Variables
        let playerScore = 0;
        let cpuScore = 0;
        let roundCount = 0;
        let isGameActive = false;
        let isRoundInProgress = false;

        const MAX_SCORE = 10;

        // Hand Visual Mapping (Using stylish icons & colors)
        const HAND_DATA = {
            rock: {
                name: '바위',
                emoji: '✊',
                iconClass: 'fa-hand-back-fist'
            },
            scissors: {
                name: '가위',
                emoji: '✌️',
                iconClass: 'fa-hand-scissors'
            },
            paper: {
                name: '보',
                emoji: '✋',
                iconClass: 'fa-hand'
            }
        };

        // Web Audio API Synthesizer Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'shake') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(220, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'draw') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(300, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'victory') {
                // Fanfare sound
                [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + (idx * 0.12));
                    g.gain.setValueAtTime(0.3, now + (idx * 0.12));
                    g.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.12) + 0.4);
                    o.start(now + (idx * 0.12));
                    o.stop(now + (idx * 0.12) + 0.4);
                });
            }
        }

        // DOM Elements
        const playerScoreEl = document.getElementById('player-score');
        const cpuScoreEl = document.getElementById('cpu-score');
        const playerHandCard = document.getElementById('player-hand-card');
        const cpuHandCard = document.getElementById('cpu-hand-card');
        const playerHandIcon = document.getElementById('player-hand-icon');
        const cpuHandIcon = document.getElementById('cpu-hand-icon');
        const statusMessage = document.getElementById('status-message');
        const choiceButtons = document.getElementById('choice-buttons');
        const startBtn = document.getElementById('start-btn');
        const historyList = document.getElementById('history-list');
        const roundCountEl = document.getElementById('round-count');

        // Start or Restart Game Trigger
        function startGame() {
            playSound('click');
            isGameActive = true;
            playerScore = 0;
            cpuScore = 0;
            roundCount = 0;

            playerScoreEl.textContent = '0';
            cpuScoreEl.textContent = '0';
            roundCountEl.textContent = '총 0라운드';
            historyList.innerHTML = '';

            // Enable Choice Controls
            choiceButtons.classList.remove('opacity-50', 'pointer-events-none');
            
            // Change Start Button UI
            startBtn.innerHTML = `<i class="fa-solid fa-rotate-left"></i> 게임 다시 시작`;
            startBtn.classList.replace('from-amber-500', 'from-amber-600');
            startBtn.classList.replace('to-amber-600', 'to-amber-700');

            resetHandDisplay();
            statusMessage.textContent = "가위, 바위, 보 중 하나를 선택하세요!";
            statusMessage.className = "text-lg sm:text-2xl font-black font-jua text-amber-900 mb-6 text-center h-8 flex items-center justify-center";
        }

        function resetHandDisplay() {
            playerHandIcon.textContent = '✊';
            cpuHandIcon.textContent = '✊';
            playerHandCard.className = "w-28 h-28 sm:w-44 sm:h-44 rounded-2xl bg-gradient-to-br from-blue-50 to-blue-100 border-4 border-blue-300 flex items-center justify-center shadow-inner relative transition-all duration-300";
            cpuHandCard.className = "w-28 h-28 sm:w-44 sm:h-44 rounded-2xl bg-gradient-to-br from-rose-50 to-rose-100 border-4 border-rose-300 flex items-center justify-center shadow-inner relative transition-all duration-300";
        }

        // Play Round Execution
        function playRound(playerChoice) {
            if (!isGameActive || isRoundInProgress) return;

            isRoundInProgress = true;
            playSound('click');

            // Reset visual states & Start animations
            resetHandDisplay();
            statusMessage.textContent = "안 내면 진 거~ 가위 바위 보!";
            statusMessage.className = "text-lg sm:text-2xl font-black font-jua text-amber-900 mb-6 text-center h-8 flex items-center justify-center animate-pulse";

            playerHandCard.classList.add('anim-shake-player');
            cpuHandCard.classList.add('anim-shake-cpu');

            // Shake sound interval
            let shakeCount = 0;
            const shakeInterval = setInterval(() => {
                playSound('shake');
                shakeCount++;
                if (shakeCount >= 3) clearInterval(shakeInterval);
            }, 180);

            // CPU choice logic
            const choices = ['scissors', 'rock', 'paper'];
            const cpuChoice = choices[Math.floor(Math.random() * choices.length)];

            // Reveal results after animation (800ms)
            setTimeout(() => {
                playerHandCard.classList.remove('anim-shake-player');
                cpuHandCard.classList.remove('anim-shake-cpu');

                // Display Chosen Hands
                playerHandIcon.textContent = HAND_DATA[playerChoice].emoji;
                cpuHandIcon.textContent = HAND_DATA[cpuChoice].emoji;

                // Determine Round Winner
                evaluateRound(playerChoice, cpuChoice);
                isRoundInProgress = false;
            }, 800);
        }

        function evaluateRound(player, cpu) {
            roundCount++;
            roundCountEl.textContent = `총 ${roundCount}라운드`;

            let result = ''; // 'win', 'lose', 'draw'

            if (player === cpu) {
                result = 'draw';
            } else if (
                (player === 'rock' && cpu === 'scissors') ||
                (player === 'scissors' && cpu === 'paper') ||
                (player === 'paper' && cpu === 'rock')
            ) {
                result = 'win';
            } else {
                result = 'lose';
            }

            // Update UI based on outcome
            if (result === 'win') {
                playerScore++;
                playerScoreEl.textContent = playerScore;
                playerScoreEl.classList.add('scale-125');
                setTimeout(() => playerScoreEl.classList.remove('scale-125'), 300);

                playerHandCard.classList.add('winner-glow');
                statusMessage.textContent = `🎉 라운드 승리! (${HAND_DATA[player].name} VS ${HAND_DATA[cpu].name})`;
                statusMessage.className = "text-lg sm:text-2xl font-black font-jua text-emerald-600 mb-6 text-center h-8 flex items-center justify-center";
                playSound('win');

            } else if (result === 'lose') {
                cpuScore++;
                cpuScoreEl.textContent = cpuScore;
                cpuScoreEl.classList.add('scale-125');
                setTimeout(() => cpuScoreEl.classList.remove('scale-125'), 300);

                cpuHandCard.classList.add('winner-glow');
                statusMessage.textContent = `😭 라운드 패배... (${HAND_DATA[player].name} VS ${HAND_DATA[cpu].name})`;
                statusMessage.className = "text-lg sm:text-2xl font-black font-jua text-rose-600 mb-6 text-center h-8 flex items-center justify-center";
                playSound('lose');

            } else {
                statusMessage.textContent = `🤝 무승부입니다! (${HAND_DATA[player].name} VS ${HAND_DATA[cpu].name})`;
                statusMessage.className = "text-lg sm:text-2xl font-black font-jua text-amber-700 mb-6 text-center h-8 flex items-center justify-center";
                playSound('draw');
            }

            // Add item to history log
            addHistoryLog(roundCount, player, cpu, result);

            // Check match win condition (10 points)
            if (playerScore >= MAX_SCORE || cpuScore >= MAX_SCORE) {
                setTimeout(() => finishGame(playerScore >= MAX_SCORE), 500);
            }
        }

        // Add history item to list
        function addHistoryLog(round, player, cpu, result) {
            const logItem = document.createElement('div');
            let bgClass = 'bg-slate-50 border-slate-200 text-slate-700';
            let badge = '<span class="text-amber-600 font-bold">무승부</span>';

            if (result === 'win') {
                bgClass = 'bg-emerald-50 border-emerald-200 text-emerald-800';
                badge = '<span class="text-emerald-600 font-bold">승리 +1</span>';
            } else if (result === 'lose') {
                bgClass = 'bg-rose-50 border-rose-200 text-rose-800';
                badge = '<span class="text-rose-600 font-bold">패배 +1</span>';
            }

            logItem.className = `flex items-center justify-between p-2 rounded-xl border ${bgClass} font-medium transition-all`;
            logItem.innerHTML = `
                <span class="font-bold text-xs text-slate-400">#${round}</span>
                <div class="flex items-center gap-2">
                    <span>나: ${HAND_DATA[player].emoji} ${HAND_DATA[player].name}</span>
                    <span class="text-xs text-slate-400">vs</span>
                    <span>AI: ${HAND_DATA[cpu].emoji} ${HAND_DATA[cpu].name}</span>
                </div>
                <div>${badge}</div>
            `;

            if (historyList.children.length === 1 && historyList.children[0].classList.contains('italic')) {
                historyList.innerHTML = '';
            }

            historyList.insertBefore(logItem, historyList.firstChild);
        }

        // Game Over / Victory Modal
        function finishGame(isPlayerWin) {
            isGameActive = false;
            choiceButtons.classList.add('opacity-50', 'pointer-events-none');

            const modal = document.getElementById('victory-modal');
            const modalCard = document.getElementById('modal-card');
            const modalIcon = document.getElementById('modal-icon');
            const modalTitle = document.getElementById('modal-title');
            const modalDesc = document.getElementById('modal-desc');

            if (isPlayerWin) {
                modalIcon.textContent = '🏆';
                modalTitle.textContent = '🎉 최종 대승리!';
                modalTitle.className = 'text-3xl font-black font-jua text-emerald-600 mb-2';
                modalDesc.textContent = `축하합니다! ${playerScore} 대 ${cpuScore} 로 10점을 먼저 달성하셨습니다!`;
                playSound('victory');

                // Confetti Celebration Effect
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }
            } else {
                modalIcon.textContent = '🤖';
                modalTitle.textContent = '💀 AI 최종 승리...';
                modalTitle.className = 'text-3xl font-black font-jua text-rose-600 mb-2';
                modalDesc.textContent = `아쉽습니다! AI가 ${cpuScore} 대 ${playerScore} 로 먼저 10점에 도달했습니다. 다시 도전해보세요!`;
                playSound('lose');
            }

            // Show Modal with smooth animation
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalCard.classList.remove('scale-90');
                modalCard.classList.add('scale-100');
            }, 10);
        }

        function resetGame() {
            playSound('click');
            const modal = document.getElementById('victory-modal');
            const modalCard = document.getElementById('modal-card');

            modal.classList.add('opacity-0');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');

            setTimeout(() => {
                modal.classList.add('hidden');
                startGame();
            }, 300);
        }
    </script>
</body>
</html>
