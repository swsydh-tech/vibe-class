<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>집을 지어라!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: 귀여운 Jua 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js (효과음 생성용 라이브러리) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        body {
            font-family: 'Jua', sans-serif;
            /* 선선하고 청량한 느낌의 배경 그라데이션 (민트/스카이블루) */
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 50%, #81d4fa 100%);
            touch-action: manipulation;
            user-select: none;
        }

        /* 벽돌이 나타날 때 제자리에서 '뿅' 하는 애니메이션 (이동 X) */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .brick {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.3), inset 0 -4px 0 rgba(0, 0, 0, 0.1), 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 벽돌이 아래에서부터 위로 차곡차곡 쌓이도록 하는 영역 */
        .building-area {
            display: flex;
            flex-wrap: wrap-reverse;
            align-content: flex-start;
            justify-content: center;
            gap: 4px;
            padding: 10px;
        }

        /* 반투명 글래스 패널 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-6 overflow-hidden">

    <header class="w-full max-w-lg text-center mt-4 mb-6">
        <h1 class="text-4xl sm:text-5xl font-extrabold text-blue-600 drop-shadow-md tracking-wide mb-2">
            🏠 집을 지어라!
        </h1>
        <p class="text-gray-600 text-lg">시원한 바람을 맞으며 핑크색 집을 지어보세요</p>
    </header>

    <main class="w-full max-w-lg flex flex-col gap-4 flex-1">
        
        <!-- 시멘트 및 벽돌 개수 표시 -->
        <div class="glass-panel rounded-2xl p-4 flex justify-around items-center shadow-lg">
            <div class="text-center flex flex-col items-center">
                <span class="text-gray-500 text-sm mb-1"><i class="fa-solid fa-sack-xmark"></i> 보유 시멘트</span>
                <div class="text-3xl font-bold text-gray-700">
                    <span id="cementCount">0</span>포대
                </div>
            </div>
            <div class="w-px h-12 bg-gray-300"></div>
            <div class="text-center flex flex-col items-center">
                <span class="text-gray-500 text-sm mb-1"><i class="fa-solid fa-cubes"></i> 쌓은 벽돌</span>
                <div class="text-3xl font-bold text-pink-500">
                    <span id="brickCount">0</span>개
                </div>
            </div>
        </div>

        <!-- 컨트롤 버튼 -->
        <div class="grid grid-cols-2 gap-4 mt-2">
            <button id="buyCementBtn" class="bg-gradient-to-b from-gray-100 to-gray-300 hover:from-gray-200 hover:to-gray-400 text-gray-700 border-2 border-gray-400 rounded-xl py-4 shadow-md font-bold text-lg flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform cursor-pointer">
                <i class="fa-solid fa-cart-shopping text-2xl text-gray-600"></i>
                시멘트 사기
            </button>
            
            <button id="buildBtn" class="bg-gradient-to-b from-pink-300 to-pink-500 hover:from-pink-400 hover:to-pink-600 text-white border-2 border-pink-400 rounded-xl py-4 shadow-md font-bold text-lg flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform opacity-50 cursor-not-allowed">
                <i class="fa-solid fa-hammer text-2xl text-white"></i>
                벽돌 쌓기 (-1)
            </button>
        </div>

        <div id="messageArea" class="h-6 text-center text-red-500 font-bold opacity-0 transition-opacity">
            시멘트가 부족합니다!
        </div>

        <div class="glass-panel rounded-2xl flex-1 mt-2 mb-4 relative overflow-hidden shadow-inner flex flex-col justify-end">
            <!-- 선선한 느낌의 윈드 아이콘 배경 -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
                <i class="fa-solid fa-wind text-8xl text-blue-300"></i>
            </div>
            <!-- 벽돌 컨테이너 -->
            <div id="wallContainer" class="building-area w-full min-h-[250px] relative z-10"></div>
        </div>
    </main>

    <script>
        let cementCount = 0;
        let brickCount = 0;
        let synth = null;

        const elCementCount = document.getElementById('cementCount');
        const elBrickCount = document.getElementById('brickCount');
        const btnBuyCement = document.getElementById('buyCementBtn');
        const btnBuild = document.getElementById('buildBtn');
        const wallContainer = document.getElementById('wallContainer');
        const messageArea = document.getElementById('messageArea');

        // 귀여운 뿅 소리를 위한 Tone.js 초기화
        async function initAudio() {
            if (!synth) {
                await Tone.start();
                synth = new Tone.MembraneSynth({
                    pitchDecay: 0.05,
                    octaves: 4,
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.1 }
                }).toDestination();
            }
        }

        function showMessage(msg) {
            messageArea.textContent = msg;
            messageArea.style.opacity = 1;
            setTimeout(() => messageArea.style.opacity = 0, 2000);
        }

        function updateBuildButton() {
            if (cementCount > 0) {
                btnBuild.classList.remove('opacity-50', 'cursor-not-allowed');
                btnBuild.classList.add('cursor-pointer');
            } else {
                btnBuild.classList.add('opacity-50', 'cursor-not-allowed');
                btnBuild.classList.remove('cursor-pointer');
            }
        }

        // 시멘트 사기 기능
        btnBuyCement.addEventListener('click', async () => {
            await initAudio();
            if (synth) synth.triggerAttackRelease("C3", "16n", Tone.now(), 0.3); // 낮고 짧은 소리
            
            cementCount++;
            elCementCount.textContent = cementCount;
            updateBuildButton();
        });

        // 벽돌 쌓기 기능
        btnBuild.addEventListener('click', async () => {
            await initAudio();
            
            if (cementCount <= 0) {
                showMessage("시멘트를 먼저 구매해주세요!");
                if (synth) synth.triggerAttackRelease("G2", "8n");
                return;
            }

            cementCount--;
            brickCount++;
            elCementCount.textContent = cementCount;
            elBrickCount.textContent = brickCount;
            updateBuildButton();

            // 귀여운 뿅 소리 (높은 음)
            const notes = ["C5", "D5", "E5", "G5", "A5", "C6"];
            const note = notes[(brickCount - 1) % notes.length];
            if (synth) synth.triggerAttackRelease(note, "16n");

            // 움직임 없이 제자리에서 핑크색 벽돌 생성
            const brick = document.createElement('div');
            brick.className = 'brick w-16 h-8 bg-pink-400 rounded-md border-2 border-pink-500';
            wallContainer.appendChild(brick);
            wallContainer.scrollTop = wallContainer.scrollHeight;
        });
    </script>
</body>
</html>
